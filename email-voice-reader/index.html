                    const emailUsername = email.split('@')[0].replace(/[._]/g, ' ');
                    const searchText = (displayName + ' ' + emailUsername).toLowerCase();

                    // Score: how many spoken words appear in the recipient?
                    let score = 0;
                    for (const word of spokenWords) {
                        if (searchText.includes(word)) {
                            score++;
                        }
                    }

                    // Require at least one word to match
                    if (score > bestScore) {
                        bestScore = score;
                        bestMatch = recipient;
                    }
                }

                return bestMatch;
            }

            async searchAndSelectRecipient(spokenName) {
                // Speech recognition writes LIC staff names the COMMON way — it hears
                // "Kathryn" and writes "Catherine," hears "Ashely" and writes "Ashley."
                // So run the same LIC_DICTATION_REPLACEMENTS dictionary used when
                // dictating a message before looking anybody up. Without this, saying
                // "forward to Kathryn" answered "I could not find anyone matching
                // Catherine," because the raw word "catherine" appears nowhere in
                // "Kathryn Evans <kathryn@legalimpactforchickens.org>".
                // Reusing the dictation dictionary (rather than keeping a second
                // recipient-only list) means adding a staff name in ONE place fixes
                // both dictation and forwarding.
                const correctedName = applyLICDictionary(spokenName, LIC_DICTATION_REPLACEMENTS);

                // Try the corrected spelling first, then the words exactly as spoken —
                // so a recipient who really is named e.g. Catherine is still reachable
                // when no LIC staffer matches.
                const namesToTry = correctedName.toLowerCase() === spokenName.toLowerCase()
                    ? [spokenName]
                    : [correctedName, spokenName];

                // First, try to match against displayed recipients (fast and reliable)
                for (const name of namesToTry) {
                    const localMatch = this.findMatchingRecipient(name, this.model.recentRecipients);
                    if (localMatch) {
                        this.view.updateStatus('Found match', name);
                        this.resolvePending(localMatch);
                        return;
                    }
                }

                // Fall back to Gmail search with validation
                for (const name of namesToTry) {
                    this.view.updateStatus('Searching...', `Looking for ${name}`);
                    const foundEmail = await this.gmail.searchForEmail(name);
                    if (foundEmail) {
                        this.resolvePending(foundEmail);
                        return;
                    }
                }

                this.speech.speak(`I could not find anyone matching ${correctedName}. Please try again, click a recent recipient, or type the email address.`);
                // Leave the exact words the speech API handed us ON SCREEN, so a
                // mishearing can be read off the phone and added to
                // LIC_DICTATION_REPLACEMENTS. Requested by Alene 2026-09-12, after
                // "forward to Sage" was heard as "siege": the spoken error named the
                // word, but a spoken word is gone once said, and the screen showed only
                // "Choose recipient". (handleCommand does write "I heard you say" first,
                // but the "Searching..." status above overwrites it before the lookup
                // finishes.) When the dictionary changed the words, show both, so the
                // screen tells her what was heard AND what was looked for.
                const heard = correctedName.toLowerCase() === spokenName.toLowerCase()
                    ? `I heard "${spokenName}" and could not find anyone matching it.`
                    : `I heard "${spokenName}" and looked for "${correctedName}", but could not find anyone matching either.`;
                this.view.updateStatus('Choose recipient', `${heard} Say the name again, tap a recent recipient, or type the email address below.`);
            }

            // ========== VIEW UPDATE ==========
            updateView() {
                const m = this.model;

                // During initialization, keep welcome screen visible and don't show main
                // This prevents the main UI from flashing before OAuth completes
                if (m.state === 'initializing' || m.state === 'welcome') {
                    return;
                }
                this.view.showMain();

                // Show/hide email display
                if (m.hasEmail) {
                    const gmailUrl = `https://mail.google.com/mail/u/0/#inbox/${m.currentEmail.threadId}`;
                    this.view.showEmail(m.currentEmail, gmailUrl, m.userEmail);
                    // Show attachments if any
                    const attachments = EmailUtils.getAttachments(m.currentEmail);
                    this.view.showAttachments(attachments);

                    // If reading attachments, override body display with attachment text
                    if (m.attachmentDisplayText !== null) {
                        this.view.setEmailBodyText(m.attachmentDisplayText);
                    }
                } else {
                    this.view.hideEmail();
                    this.view.hideAttachments();
                }

                // Show/hide dictation
                if (['dictating', 'confirming-send'].includes(m.state)) {
                    this.view.showDictation(m.dictatedText, m.state === 'dictating');
                } else {
                    this.view.hideDictation();
                }

                // Render available commands
                this.view.renderCommands(this.getAvailableCommands());
            }

            // ========== PENDING PROMISE HELPERS ==========
            resolvePending(value) {
                if (this.pendingResolver) {
                    const resolver = this.pendingResolver;
                    this.pendingResolver = null;
                    resolver(value);
                }
            }

            waitForResponse() {
                return new Promise(resolve => {
                    this.pendingResolver = resolve;
                });
            }

            // ========== DICTATION HELPERS ==========

            // Enter dictation mode: switch speech recognition to continuous + interim
            startDictationMode() {
                this.committedDictation = '';
                this.speech.enterDictationMode();
                this.startDictationSilenceTimeout();
            }

            // Exit dictation mode: switch speech recognition back to command mode
            // Activates a cooldown guard to prevent accidental command execution
            stopDictationMode() {
                this.view.clearInterimText();
                this.speech.exitDictationMode();
                // Cooldown: ignore voice commands for 3 seconds after leaving dictation
                // This prevents the mic from picking up leftover speech or TTS echo
                this.commandCooldown = true;
                setTimeout(() => { this.commandCooldown = false; }, 3000);
            }

            resetDictationTimeout() {
                if (this.dictationTimeout) clearTimeout(this.dictationTimeout);
                // User has spoken or typed, so reset the silence timeout too
                this.clearDictationSilenceTimeout();
                // Long fallback: auto-finish after 45 seconds of silence
                // Primary way to finish is saying "done" or tapping the Done button
                this.dictationTimeout = setTimeout(() => {
                    const text = this.view.getDictationText();
                    if (text) {
                        this.model.dictatedText = text;
                        this.finishDictation();
                    }
                }, 45000);
            }

            // Start a 60-second silence timeout that cancels dictation if nothing is said or typed
            startDictationSilenceTimeout() {
                this.clearDictationSilenceTimeout();
                this.dictationSilenceTimeout = setTimeout(() => {
                    if (this.model.state === 'dictating') {
                        const text = this.view.getDictationText();
                        if (text) {
                            // If there's text, finish dictation normally
                            this.finishDictation();
                        } else {
                            // No text at all — cancel and go back to idle
                            this.cancelDictation();
                        }
                    }
                }, 60000);
            }

            clearDictationSilenceTimeout() {
                if (this.dictationSilenceTimeout) {
                    clearTimeout(this.dictationSilenceTimeout);
                    this.dictationSilenceTimeout = null;
                }
            }

            cancelDictation() {
                if (this.dictationTimeout) clearTimeout(this.dictationTimeout);
                this.clearDictationSilenceTimeout();
                this.stopDictationMode();
                this.view.hideDictation();
                this.model.dictatedText = '';
                this.speech.speak('No response detected. Going back.');
                // Resolve with special cancel value so the calling flow exits cleanly
                if (this.pendingResolver) {
                    this.resolvePending('__dictation_cancelled__');
                }
            }

            finishDictation() {
                if (this.dictationTimeout) clearTimeout(this.dictationTimeout);
                this.clearDictationSilenceTimeout();
                this.stopDictationMode();
                this.model.dictatedText = this.view.getDictationText();
                if (this.pendingResolver) {
                    this.resolvePending(this.model.dictatedText);
                }
            }

            // ========== MIC BUTTONS ==========
            async initMicPicker() {
                const container = document.getElementById('micButtonsContainer');
                if (!container) return;
                await this.buildMicButtons(container);
            }

            async buildMicButtons(container) {
                // Request mic permission so device labels are available
                try {
                    const permStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    permStream.getTracks().forEach(t => t.stop());
                } catch (e) {
                    // Permission denied — show a single Continue button with no device selection
                    container.innerHTML = '';
                    const btn = this.makeMicBtn('🎤 Continue', () => this.onMicSelected('default'));
                    container.appendChild(btn);
                    return;
                }

                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    // Exclude the virtual "communications" alias; keep named mics + any 'default' entry
                    const mics = devices.filter(d =>
                        d.kind === 'audioinput' && d.deviceId !== 'communications'
                    );

                    container.innerHTML = '';

                    if (mics.length === 0) {
                        const btn = this.makeMicBtn('🎤 Continue', () => this.onMicSelected('default'));
                        container.appendChild(btn);
                        return;
                    }

                    mics.forEach(mic => {
                        const label = mic.deviceId === 'default'
                            ? 'System Default'
                            : (mic.label || `Microphone ${mic.deviceId.slice(0, 8)}`);
                        const btn = this.makeMicBtn('🎤 ' + label, () => this.onMicSelected(mic.deviceId));
                        container.appendChild(btn);
                    });
                } catch (e) {
                    console.warn('Could not enumerate mic devices:', e);
                    container.innerHTML = '';
                    const btn = this.makeMicBtn('🎤 Continue', () => this.onMicSelected('default'));
                    container.appendChild(btn);
                }
            }

            makeMicBtn(label, onClick) {
                const btn = document.createElement('button');
                btn.className = 'mic-btn';
                btn.textContent = label;

                // On desktop, if the user picks an AirPods option, warn them that the
                // browser can't actually route the mic — they must change the system
                // default input in Mac Sound settings. Mobile (iPhone/iPad/Android)
                // skips this because iOS handles mic routing at the OS level.
                const isAirPods = /airpods/i.test(label);
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                const shouldWarn = isAirPods && !isMobile;

                const handler = (e) => {
                    if (e && e.type === 'touchend') e.preventDefault();
                    if (shouldWarn) {
                        this.showAirPodsReminder(onClick);
                    } else {
                        onClick();
                    }
                };
                btn.addEventListener('click', handler);
                btn.addEventListener('touchend', handler);
                return btn;
            }

            // Desktop-only reminder: the Web Speech API ignores in-app mic picks,
            // so users must set AirPods as the input device in Mac Sound settings.
            showAirPodsReminder(onConfirm) {
                const overlay = document.createElement('div');
                overlay.className = 'airpods-modal-overlay';
                overlay.innerHTML = `
                    <div class="airpods-modal">
                        <div class="airpods-modal-title">One more step for AirPods</div>
                        <div class="airpods-modal-body">
                            You may need to adjust your browser or computer's audio settings to make sure your AirPods are selected as the microphone.
                            <br><br>
                            Otherwise, the app might listen through your computer's built-in microphone instead of your AirPods.
                        </div>
                        <button class="airpods-modal-btn" type="button">Got it — continue</button>
                    </div>
                `;
                document.body.appendChild(overlay);
                const closeBtn = overlay.querySelector('.airpods-modal-btn');
                const dismiss = () => {
                    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                    onConfirm();
                };
                closeBtn.addEventListener('click', dismiss);
                closeBtn.addEventListener('touchend', (e) => { e.preventDefault(); dismiss(); });
            }

            // ========== SIGN-IN RENEWAL ==========
            // Shown only when GmailService.renewToken() could not renew Google's
            // hour-long sign-in pass without a tap. Whatever Alene asked for (an
            // archive, the next batch of emails) is paused inside fetchWithAuth and
            // finishes by itself once the tap brings a new pass. The whole screen is
            // the tap target, so she doesn't have to aim while walking. Reuses the
            // AirPods reminder's styles.
            showRenewSignIn() {
                if (this.renewOverlay) return;
                this.stateBeforeRenewal = this.model.state;
                this.model.setState('renewing-sign-in');
                this.view.updateStatus('Google sign-in needs renewing', 'Tap anywhere on the screen');

                const overlay = document.createElement('div');
                overlay.className = 'airpods-modal-overlay';
                overlay.innerHTML = `
                    <div class="airpods-modal">
                        <div class="airpods-modal-title">Tap to renew your Google sign-in</div>
                        <div class="airpods-modal-body">
                            Google's sign-in for this app lasts one hour. Tap anywhere on the screen to renew it, and the app will pick up right where you left off.
                        </div>
                        <button class="airpods-modal-btn" type="button">Renew sign-in</button>
                    </div>
                `;
                const onTap = (e) => {
                    if (e && e.type === 'touchend') e.preventDefault();
                    if (Date.now() - this.lastRenewTapTime < 2000) return; // one tap, not a double
                    this.lastRenewTapTime = Date.now();
                    this.view.updateStatus('Renewing Google sign-in...');
                    // Must run inside this tap: browsers open Google's window only then
                    this.gmail.renewFromTap();
                };
                overlay.addEventListener('click', onTap);
                overlay.addEventListener('touchend', onTap);
                document.body.appendChild(overlay);
                this.renewOverlay = overlay;

                this.speech.speak('Your Google sign-in needs to be renewed. Please tap the screen once, and I will pick up where you left off.');
            }

            renewSignInTapFailed() {
                this.view.updateStatus('Google sign-in needs renewing', 'That did not work. Tap anywhere to try again.');
                this.speech.speak('That did not work. Please tap the screen to try again.');
            }

            hideRenewSignIn() {
                if (this.renewOverlay && this.renewOverlay.parentNode) {
                    this.renewOverlay.parentNode.removeChild(this.renewOverlay);
                }
                this.renewOverlay = null;
                this.view.updateStatus('Google sign-in renewed');
                if (this.model.state === 'renewing-sign-in') {
                    this.model.setState(this.stateBeforeRenewal || 'idle');
                }
            }

            // ========== INITIALIZATION ==========
            init() {
                // Start OAuth flow - Client ID is embedded in the app
                this.gmail.initAuth(
                    async () => {
                        // Pre-fetch user email so we can say "you" instead of their address
                        await this.gmail.getMyEmail();
                        // Restore welcome text in case the timeout overwrote it with an error
                        const ctaEl = document.querySelector('.welcome-cta');
                        if (ctaEl) {
                            ctaEl.innerHTML = 'Welcome!';
                            ctaEl.style.fontSize = '';
                        }
                        // Show welcome screen (requires tap to enable audio on iOS)
                        this.model.setState('welcome');
                        // Populate mic picker in the background while welcome screen is visible
                        this.initMicPicker();
                        // File any mishearing notes an earlier visit could not file.
                        this.flushMishearingQueue();
                    },
                    (errorMsg) => {
                        // OAuth failed - show error on welcome screen
                        console.error('Auth failed:', errorMsg);
                        const ctaEl = document.querySelector('.welcome-cta');
                        if (ctaEl) {
                            ctaEl.innerHTML = '⚠️ ' + errorMsg + '<br><br>Try opening in Chrome, or disable content blockers in Safari settings.';
                            ctaEl.style.fontSize = '20px';
                        }
                    }
                );
            }

            // Called when user clicks a mic button on the welcome screen.
            // The button click IS the user gesture that unlocks iOS audio — speak() must be
            // called synchronously here (no await before it).
            onMicSelected(deviceId) {
                if (this.model.state !== 'welcome') return;

                // Update UI immediately
                this.model.setState('loading');
                this.view.updateStatus('Fetching your emails...', 'One moment please');

                // CRITICAL: This synchronous speech.speak() call unlocks iOS audio.
                // Do NOT add any await/async before this line!
                this.speech.speak('Welcome to Voice Email Reader! Let me check your inbox.').then(async () => {
                    // Claim the chosen mic before speech recognition starts
                    if (deviceId && deviceId !== 'default') {
                        await this.speech.setMicDevice(deviceId);
                    }
                    try {
                        // Fetch emails
                        const emails = await this.gmail.fetchUnreadEmails();
                        this.model.setEmails(emails);

                        if (emails.length === 0) {
                            this.view.updateStatus('No unread emails', 'Your inbox is empty!');
                            this.model.setState('idle');
                            this.speech.allowAutoRestart = true;
                            this.speech.startListening();
                            this.speech.speak('You have no unread emails. Great job!');
                        } else {
                            this.view.updateStatus(`Found ${emails.length} unread emails`, 'Starting to read...');
                            this.model.setState('reading');
                            this.speech.allowAutoRestart = true;
                            this.speech.startListening();
                            this.readCurrentEmail();
                        }
                    } catch (error) {
                        console.error('Error fetching emails:', error);
                        this.view.updateStatus('Error', 'Could not fetch emails. Please try again.');
                        this.model.setState('idle');
                        this.speech.allowAutoRestart = true;
                        this.speech.startListening();
                        this.speech.speak('Sorry, I had trouble fetching your emails. Please try again.');
                    }
                });
            }

            signOut() {
                this.gmail.signOut();
                // Same stand-down as stopReading(): the microphone keeps listening after
                // sign-out, so without this the app would keep answering overheard
                // conversation with "I did not understand" until the page is closed.
                this.quietMode = true;
                this.model.emails = [];
                this.model.currentEmailIndex = 0;
                this.model.setState('idle');
                this.view.updateStatus('Signed out', 'Please refresh the page to sign in again');
            }

            // ========== EMAIL READING ==========
            async startReading() {
                if (!this.model.isAuthenticated) return;

                // After a check for more emails failed to reach Gmail, "play" retries
                // that check, so emails already heard this session aren't read again.
                if (this.lastCheckFailed) {
                    this.lastCheckFailed = false;
                    await this.checkForMoreEmails();
                    return;
                }

                this.model.setState('loading');
                this.view.updateStatus('Fetching unread emails...');

                let emails;
                try {
                    emails = await this.gmail.fetchUnreadEmails();
                } catch (error) {
                    console.error('Error fetching emails:', error);
                    this.view.updateStatus('Error', 'Could not fetch emails. Please try again.');
                    this.model.setState('idle');
                    this.speech.speak('Sorry, I had trouble fetching your emails. Please try again.');
                    return;
                }
                this.model.setEmails(emails);
                this.model.setCurrentEmailIndex(0);

                if (emails.length === 0) {
                    this.view.updateStatus('No unread emails', 'Your inbox is empty!');
                    this.model.setState('idle');
                    this.speech.speak('You have no unread emails. Great job!');
                } else {
                    this.view.updateStatus(`Found ${emails.length} unread emails`, 'Starting to read...');
                    this.model.setState('reading');
                    this.readCurrentEmail();
                }
            }

            stopReading() {
                this.speech.cancel();
                // Deliberate stand-down: spoken "stop" (also "pause"/"wait"/"hold on")
                // and the Stop button both land here, and nothing else calls this.
                this.quietMode = true;
                if (this.model.hasEmail) {
                    this.model.setState('idle');
                    this.view.updateStatus('Stopped reading', 'Say "play" to continue');
                } else {
                    this.model.setState('idle');
                    this.view.updateStatus('Stopped');
                }
            }

            async continueReading() {
                if (this.speech.canResume) {
                    const isAttachment = this.model.attachmentDisplayText !== null;
                    const readingState = isAttachment ? 'reading-attachment' : 'reading';
                    const continuingMsg = isAttachment ? 'Continuing attachment...' : 'Continuing email...';
                    const statusMsg = isAttachment ? 'Reading attachments...' : 'Reading email aloud...';

                    this.model.setState(readingState);
                    this.view.updateStatus(continuingMsg);
                    setTimeout(() => {
                        if (this.model.state === readingState) {
                            this.view.updateStatus(statusMsg);
                        }
                    }, 1000);
                    await this.speech.resume();
                    // After resume finishes (or is interrupted again), update state
                    if (!this.speech.isCancelled) {
                        if (isAttachment) {
                            this.model.attachmentDisplayText = null;
                            this.view.updateStatus('Finished reading attachments');
                            await this.speech.speak('Finished reading attachments. What would you like to do with this email?');
                        } else {
                            this.view.updateStatus('Finished reading', 'What would you like to do with this email?');
                        }
                        this.model.setState('idle');
                    }
                } else if (this.model.hasEmail) {
                    // No resume state but we have an email - restart from beginning
                    await this.speech.speak('Starting email from the beginning.');
                    this.readCurrentEmail();
                } else {
                    await this.speech.speak('No email to continue. Say "start" to check for new emails.');
                }
            }

            async handleSkipForward() {
                const isAttachment = this.model.state === 'reading-attachment' || this.model.attachmentDisplayText !== null;
                const result = this.speech.skipForward(3);

                if (result === 'past-end') {
                    if (isAttachment) {
                        // Past the end of attachments — finish attachment reading
                        this.model.attachmentDisplayText = null;
                        this.view.updateStatus('Finished reading attachments');
                        await this.speech.speak('Finished reading attachments. What would you like to do with this email?');
                        this.model.setState('idle');
                    } else {
                        // Past the end of the email — move to next email
                        this.nextEmail();
                    }
                } else {
                    // Jump succeeded — resume reading from new position
                    const readingState = isAttachment ? 'reading-attachment' : 'reading';
                    const statusMsg = isAttachment ? 'Reading attachments...' : 'Reading email aloud...';

                    this.model.setState(readingState);
                    this.view.updateStatus('Leaping...');
                    setTimeout(() => {
                        if (this.model.state === readingState) {
                            this.view.updateStatus(statusMsg);
                        }
                    }, 1000);
                    await this.speech.resume();
                    if (!this.speech.isCancelled) {
                        if (isAttachment) {
                            this.model.attachmentDisplayText = null;
                            this.view.updateStatus('Finished reading attachments');
                            await this.speech.speak('Finished reading attachments. What would you like to do with this email?');
                        } else {
                            this.view.updateStatus('Finished reading', 'What would you like to do with this email?');
                        }
                        this.model.setState('idle');
                    }
                }
            }

            async handleSkipBack() {
                const isAttachment = this.model.state === 'reading-attachment' || this.model.attachmentDisplayText !== null;
                this.speech.skipBack(3);

                const readingState = isAttachment ? 'reading-attachment' : 'reading';
                const statusMsg = isAttachment ? 'Reading attachments...' : 'Reading email aloud...';

                this.model.setState(readingState);
                this.view.updateStatus('Rewinding...');
                setTimeout(() => {
                    if (this.model.state === readingState) {
                        this.view.updateStatus(statusMsg);
                    }
                }, 1000);
                await this.speech.resume();
                if (!this.speech.isCancelled) {
                    if (isAttachment) {
                        this.model.attachmentDisplayText = null;
                        this.view.updateStatus('Finished reading attachments');
                        await this.speech.speak('Finished reading attachments. What would you like to do with this email?');
                    } else {
                        this.view.updateStatus('Finished reading', 'What would you like to do with this email?');
                    }
                    this.model.setState('idle');
                }
            }

            async readCurrentEmail() {
                this.model.attachmentDisplayText = null;
                const email = this.model.currentEmail;
                if (!email) {
                    await this.checkForMoreEmails();
                    return;
                }

                this.model.setState('reading');
                this.view.updateStatus('Reading email aloud...');

                const fromRaw = EmailUtils.getHeader(email, 'From') || 'Unknown sender';
                const toRaw = EmailUtils.getHeader(email, 'To') || '';
                const ccRaw = EmailUtils.getHeader(email, 'Cc') || '';
                const subject = EmailUtils.getHeader(email, 'Subject') || 'No subject';
                const body = EmailUtils.getEmailBody(email);

                // Replace user's email with "you" for natural speech
                const userEmail = this.model.userEmail;
                const from = EmailUtils.replaceUserEmail(fromRaw, userEmail);
                const to = EmailUtils.replaceUserEmail(toRaw, userEmail);
                const cc = EmailUtils.replaceUserEmail(ccRaw, userEmail);

                // Get attachments
                const attachments = EmailUtils.getAttachments(email);
                const readableAttachments = attachments.filter(a => EmailUtils.isReadableAttachment(a));

                // Build speech text
                let headerText = `From ${from}.`;
                if (to) {
                    const toAddrs = to.split(',').map(a => a.trim());
                    headerText += toAddrs.length <= 3
                        ? ` To: ${toAddrs.join(', ')}.`
                        : ` To: ${toAddrs.slice(0, 3).join(', ')}, and ${toAddrs.length - 3} others.`;
                }
                if (cc) {
                    const ccAddrs = cc.split(',').map(a => a.trim());
                    headerText += ccAddrs.length <= 3
                        ? ` CC: ${ccAddrs.join(', ')}.`
                        : ` CC: ${ccAddrs.slice(0, 3).join(', ')}, and ${ccAddrs.length - 3} others.`;
                }
                headerText += ` Subject: ${subject}.`;

                // Strip URLs from body for speech (so links aren't read aloud)
                const bodyForSpeech = EmailUtils.stripUrlsForSpeech(body);

                // Add attachment announcement after the body
                let attachmentText = '';
                if (attachments.length > 0) {
                    const attachmentNames = attachments.map(a => a.filename).join(', ');
                    if (attachments.length === 1) {
                        attachmentText += ` This email has 1 attachment: ${attachmentNames}.`;
                    } else {
                        attachmentText += ` This email has ${attachments.length} attachments: ${attachmentNames}.`;
                    }
                    if (readableAttachments.length > 0) {
                        attachmentText += ` Say "read attachments" to hear ${readableAttachments.length === 1 ? 'it' : 'them'}.`;
                    }
                }

                const fullText = headerText + ' ' + bodyForSpeech + attachmentText;

                // Delay scrolling until header is read plus ~40 words (~200 chars) into body
                const scrollStartThreshold = headerText.length + 200;

                await this.speech.speakWithScroll(fullText, this.view, scrollStartThreshold);
            }

            async checkForMoreEmails() {
                this.model.setState('loading');
                this.view.updateStatus('Checking for more emails...');

                // Leave out every email already fetched this session, so one left
                // unread with "next" isn't read twice. fetchUnreadEmails pages past
                // them to the older emails behind them.
                const seenIds = new Set(this.model.emails.map(e => e.id));

                let unseenEmails;
                try {
                    unseenEmails = await this.gmail.fetchUnreadEmails(seenIds);
                } catch (error) {
                    // Never announce the end of the inbox when the truth is that Gmail
                    // didn't answer: that mix-up is what hid the rest of the backlog.
                    console.error('Error checking for more emails:', error);
                    this.lastCheckFailed = true;
                    this.model.setState('idle');
                    this.view.updateStatus('Could not reach Gmail', 'Say "play" to try again');
                    await this.speech.speak('Sorry, I had trouble reaching Gmail, so I could not check for more emails. Say play to try again.');
                    return;
                }

                if (unseenEmails.length > 0) {
                    // Append the new batch onto the emails already read this session,
                    // instead of replacing them. Keeping the previous batch in memory
                    // lets "previous" still work on the first email of the new batch —
                    // it steps back to the last email of the last batch. (It also makes
                    // de-duplication reliable across batches, so no email is re-read.)
                    const firstNewIndex = this.model.emails.length;
                    this.model.setEmails(this.model.emails.concat(unseenEmails));
                    this.model.setCurrentEmailIndex(firstNewIndex);
                    this.model.setState('reading');
                    await this.speech.speak(`Found ${unseenEmails.length} more unread emails. Continuing.`);
                    this.readCurrentEmail();
                } else {
                    this.view.updateStatus('No more unread emails');
                    await this.speech.speak('You have reached the end of your unread emails. Great job!');
                    this.model.setState('idle');
                }
            }

            async nextEmail() {
                this.speech.clearResumeState(); // Clear resume state when changing emails
                await this.speech.speak('Moving to next email.');
                this.model.setCurrentEmailIndex(this.model.currentEmailIndex + 1);
                this.readCurrentEmail();
            }

            async previousEmail() {
                if (this.model.canGoPrevious) {
                    this.speech.clearResumeState(); // Clear resume state when changing emails
                    await this.speech.speak('Going back to previous email.');
                    this.model.setCurrentEmailIndex(this.model.currentEmailIndex - 1);
                    this.readCurrentEmail();
                } else {
                    await this.speech.speak('This is the first email. Cannot go back.');
                }
            }

            // ========== EMAIL ACTIONS ==========
            async markAsRead() {
                this.speech.clearResumeState(); // Clear resume state when taking action on email
                this.view.updateStatus('Marking as read...');
                try {
                    await this.gmail.modifyEmail(this.model.currentEmail.id, [], ['UNREAD']);
                    await this.speech.speak('Email marked as red.'); // Intentional: "red" not "read" for correct TTS pronunciation
                    this.model.setCurrentEmailIndex(this.model.currentEmailIndex + 1);
                    this.readCurrentEmail();
                } catch (e) {
                    await this.speech.speak('Sorry, I could not mark that email as red.'); // Intentional: "red" not "read" for correct TTS pronunciation
                }
            }

            async archiveEmail() {
                this.speech.clearResumeState(); // Clear resume state when taking action on email
                this.view.updateStatus('Archiving email...');
                try {
                    await this.gmail.modifyEmail(this.model.currentEmail.id, [], ['INBOX', 'UNREAD']);
                    await this.speech.speak('Email archived.');
                    this.model.setCurrentEmailIndex(this.model.currentEmailIndex + 1);
                    this.readCurrentEmail();
                } catch (e) {
                    await this.speech.speak('Sorry, I could not archive that email.');
                }
            }

            async markAsSpam() {
                this.speech.clearResumeState(); // Clear resume state when taking action on email
                this.view.updateStatus('Marking as spam...');
                try {
                    await this.gmail.modifyEmail(this.model.currentEmail.id, ['SPAM'], ['INBOX', 'UNREAD']);
                    await this.speech.speak('Email marked as spam.');
                    this.model.setCurrentEmailIndex(this.model.currentEmailIndex + 1);
                    this.readCurrentEmail();
                } catch (e) {
                    await this.speech.speak('Sorry, I could not mark that email as spam.');
                }
            }

            // ========== REPLY FLOW ==========
            async handleReply({ isEdit = false } = {}) {
                const email = this.model.currentEmail;
                const from = EmailUtils.getHeader(email, 'From');
                const to = EmailUtils.getHeader(email, 'To');
                const cc = EmailUtils.getHeader(email, 'Cc');
                const senderName = from.replace(/<[^>]+>/, '').trim() || from;

                // Use stored reply-all choice as default
                let isReplyAll = this.model.isReplyAll;

                if (!isEdit) {
                    // Only ask about reply type on first entry, not on edit
                    const myEmail = await this.gmail.getMyEmail();
                    const toIsNotMe = to && !to.toLowerCase().includes(myEmail.toLowerCase());
                    const hasOthers = cc || (to && to.includes(',')) || toIsNotMe;
                    isReplyAll = false;

                    if (hasOthers) {
                        this.model.setState('confirming-reply-type');
                        this.view.updateStatus('Choose reply type');
                        this.speech.speak('This email has other recipients. Say Reply to Sender Only, or Reply All to respond to everyone.');

                        const response = await this.waitForResponse();
                        if (response === 'cancel') {
                            this.model.setState('idle');
                            this.view.updateStatus('Waiting for command');
                            this.speech.speak('Reply cancelled. What would you like to do with this email?');
                            return;
                        }
                        isReplyAll = response.includes('all');
                    }
                }

                this.model.isReplyAll = isReplyAll;

                // Start dictation
                this.model.setState('dictating');

                if (isEdit) {
                    this.model.userTouchedTextArea = false;
                    // Preserve existing text for editing
                    this.view.updateStatus('Editing response', 'Speak to replace, or tap text to edit by hand. Say "done" when finished.');
                    this.view.showDictation(this.model.dictatedText, true);
                    this.startDictationMode();
                    this.speech.speak('Your previous message is shown. Speak to replace it, or tap the text to edit it by hand. Say done when finished.');
                } else {
                    this.model.userTouchedTextArea = true;
                    this.model.dictatedText = '';
                    this.view.updateStatus('Listening for response', 'Say "done" when finished');
                    this.view.showDictation('', true);
                    this.startDictationMode();

                    if (isReplyAll) {
                        this.speech.speak('What would you like to say in your response to the group? Say done when finished.');
                    } else {
                        this.speech.speak(`What would you like to say in your response to ${senderName}? Say done when finished.`);
                    }
                }

                // Wait for dictation to complete
                const responseText = await this.waitForResponse();

                // If dictation timed out, go back to idle
                if (responseText === '__dictation_cancelled__') {
                    this.view.hideDictation();
                    this.model.setState('idle');
                    this.view.updateStatus('Waiting for command');
                    return;
                }

                // Confirm
                this.model.dictatedText = responseText;
                this.model.setState('confirming-send');
                this.view.updateStatus('Confirm response');
                this.speech.speak(`You said: ${responseText}. Say Send to send, Edit to try again, or Cancel to go back.`);

                const confirmation = await this.waitForResponse();

                if (confirmation === 'send') {
                    this.view.hideDictation();
                    await this.sendReply(responseText, isReplyAll);
                } else if (confirmation === 'edit') {
                    this.view.hideDictation();
                    await this.handleReply({ isEdit: true }); // Edit: skip reply-type, preserve text
                } else {
                    this.view.hideDictation();
                    this.model.setState('idle');
                    this.view.updateStatus('Waiting for command');
                    this.speech.speak('Response cancelled. What would you like to do with this email?');
                }
            }

            async sendReply(text, isReplyAll) {
                this.view.updateStatus('Sending reply...');

                try {
                    const email = this.model.currentEmail;
                    const from = EmailUtils.getHeader(email, 'From');
                    const origTo = EmailUtils.getHeader(email, 'To');
                    const origCc = EmailUtils.getHeader(email, 'Cc');
                    const subject = EmailUtils.getHeader(email, 'Subject');
                    const messageId = EmailUtils.getHeader(email, 'Message-ID');
                    const references = EmailUtils.getHeader(email, 'References') || messageId;

                    let toRecipients = from;
                    let ccRecipients = '';

                    if (isReplyAll) {
                        const myEmail = await this.gmail.getMyEmail();

                        if (origTo) {
                            const others = origTo.split(',')
                                .map(a => a.trim())
                                .filter(a => !a.toLowerCase().includes(myEmail.toLowerCase()))
                                .filter(a => !a.toLowerCase().includes(from.toLowerCase().replace(/<[^>]+>/, '').trim()));
                            if (others.length) toRecipients += ', ' + others.join(', ');
                        }

                        if (origCc) {
                            const ccList = origCc.split(',')
                                .map(a => a.trim())
                                .filter(a => !a.toLowerCase().includes(myEmail.toLowerCase()));
                            if (ccList.length) ccRecipients = ccList.join(', ');
                        }
                    }

                    // Get original email info for quoting
                    const origDate = EmailUtils.getHeader(email, 'Date') || '';
                    const rawBody = EmailUtils.getRawEmailBody(email);

                    // Build the quoted original message in HTML
                    const quoteHeader = `On ${origDate}, ${from} wrote:`;
                    let quotedContent;
                    if (rawBody.isHtml) {
                        quotedContent = rawBody.body;
                    } else {
                        quotedContent = `<pre>${rawBody.body}</pre>`;
                    }

                    const htmlBody = `<p>${text.replace(/\n/g, '<br>')}</p><br>` +
                        `<div class="gmail_quote">${quoteHeader}<br>` +
                        `<blockquote style="margin:0 0 0 .8ex;border-left:1px solid #ccc;padding-left:1ex">` +
                        `${quotedContent}</blockquote></div>`;

                    const replySubject = EmailUtils.encodeHeaderValue('Re: ' + subject);
                    const emailLines = [`To: ${toRecipients}`];
                    if (ccRecipients) emailLines.push(`Cc: ${ccRecipients}`);
                    emailLines.push(
                        `Subject: ${replySubject}`,
                        `In-Reply-To: ${messageId}`,
                        `References: ${references}`,
                        'Content-Type: text/html; charset=UTF-8',
                        '',
                        htmlBody
                    );

                    await this.gmail.sendEmail(emailLines.join('\n'), email.threadId);

                    this.model.setState('idle');
                    this.view.updateStatus('Waiting for command');
                    this.speech.speak('Reply sent. What would you like to do with this email now?');
                } catch (e) {
                    console.error('Send reply error:', e);
                    this.speech.speak('Sorry, I could not send that reply.');
                    this.model.setState('idle');
                }
            }

            // ========== FORWARD FLOW ==========
            async handleForward() {
                this.view.updateStatus('Loading recent recipients...');
                const recipients = await this.gmail.getRecentRecipients(6);
                this.model.recentRecipients = recipients;

                this.model.setState('confirming-forward-recipient');
                this.view.updateStatus('Choose recipient');
                this.speech.speak('Who would you like to forward this email to?');

                const selectedRecipient = await this.waitForResponse();

                if (selectedRecipient === 'cancel') {
                    this.model.setState('idle');
                    this.view.updateStatus('Waiting for command');
                    this.speech.speak('Forward cancelled. What would you like to do with this email?');
                    return;
                }

                // Extract email address
                const match = selectedRecipient.match(/<([^>]+)>/);
                const emailAddress = match ? match[1] : selectedRecipient;

                // Confirm recipient
                this.model.setState('confirming-forward');
                this.view.updateStatus('Confirm recipient', `Forward to ${emailAddress}?`);
                this.speech.speak(`Forward to ${emailAddress}. Say Yes to confirm, or No to cancel.`);

                const confirmation = await this.waitForResponse();

                if (confirmation.includes('yes')) {
                    await this.forwardEmail(emailAddress);
                } else {
                    this.model.setState('idle');
                    this.view.updateStatus('Waiting for command');
                    this.speech.speak('Forward cancelled. What would you like to do with this email?');
                }
            }

            async forwardEmail(toAddress, { isEdit = false } = {}) {
                let forwardMessage = '';

                if (isEdit) {
                    // Edit: skip "add a message?" and go straight to dictation with preserved text
                    this.model.userTouchedTextArea = false;
                    this.model.setState('dictating');
                    this.view.updateStatus('Editing message', 'Speak to replace, or tap text to edit by hand. Say "done" when finished.');
                    this.view.showDictation(this.model.dictatedText, true);
                    this.startDictationMode();
                    this.speech.speak('Your previous message is shown. Speak to replace it, or tap the text to edit it by hand. Say done when finished.');

                    forwardMessage = await this.waitForResponse();

                    if (forwardMessage === '__dictation_cancelled__') {
                        this.view.hideDictation();
                        this.model.setState('idle');
                        this.view.updateStatus('Waiting for command');
                        return;
                    }

                    this.model.dictatedText = forwardMessage;
                    this.model.setState('confirming-send');
                    this.view.updateStatus('Confirm forward');
                    this.speech.speak(`You said: ${forwardMessage}. Say Send to forward with this message, Edit to try again, or Cancel to go back.`);

                    const confirmation = await this.waitForResponse();
                    this.view.hideDictation();

                    if (confirmation === 'edit') {
                        return await this.forwardEmail(toAddress, { isEdit: true });
                    } else if (confirmation !== 'send') {
                        this.model.setState('idle');
                        this.view.updateStatus('Waiting for command');
                        this.speech.speak('Forward cancelled. What would you like to do with this email?');
                        return;
                    }
                } else {
                    // First time: ask about adding a message
                    this.model.setState('confirming-forward-message');
                    this.view.updateStatus('Add message?');
                    this.speech.speak('Would you like to add a message to this forward? Say Yes or No.');

                    const wantsMessage = await this.waitForResponse();

                    if (wantsMessage.includes('yes')) {
                        // Get message via dictation
                        this.model.dictatedText = '';
                        this.model.userTouchedTextArea = true;
                        this.model.setState('dictating');
                        this.view.updateStatus('Listening for message', 'Say "done" when finished');
                        this.view.showDictation('', true);
                        this.startDictationMode();
                        this.speech.speak('What would you like to say in your message? Say done when finished.');

                        forwardMessage = await this.waitForResponse();

                        if (forwardMessage === '__dictation_cancelled__') {
                            this.view.hideDictation();
                            this.model.setState('idle');
                            this.view.updateStatus('Waiting for command');
                            return;
                        }

                        // Confirm
                        this.model.dictatedText = forwardMessage;
                        this.model.setState('confirming-send');
                        this.view.updateStatus('Confirm forward');
                        this.speech.speak(`You said: ${forwardMessage}. Say Send to forward with this message, Edit to try again, or Cancel to go back.`);

                        const confirmation = await this.waitForResponse();
                        this.view.hideDictation();

                        if (confirmation === 'edit') {
                            return await this.forwardEmail(toAddress, { isEdit: true });
                        } else if (confirmation !== 'send') {
                            this.model.setState('idle');
                            this.view.updateStatus('Waiting for command');
                            this.speech.speak('Forward cancelled. What would you like to do with this email?');
                            return;
                        }
                    }
                }

                // Send the forward
                this.view.updateStatus('Forwarding email...');

                try {
                    const email = this.model.currentEmail;
                    const subject = EmailUtils.getHeader(email, 'Subject');
                    const rawBody = EmailUtils.getRawEmailBody(email);
                    const messageId = EmailUtils.getHeader(email, 'Message-ID');
                    const references = EmailUtils.getHeader(email, 'References') || messageId;
                    const origFrom = EmailUtils.getHeader(email, 'From');
                    const origDate = EmailUtils.getHeader(email, 'Date') || '';
                    const origTo = EmailUtils.getHeader(email, 'To');

                    const fwdSubject = EmailUtils.encodeHeaderValue('Fwd: ' + subject);

                    // Build forwarded message header info
                    const fwdHeader = `From: ${origFrom}<br>Date: ${origDate}<br>Subject: ${subject}<br>To: ${origTo}`;

                    // Build the HTML body
                    let htmlBody = '';
                    if (forwardMessage) {
                        htmlBody += `<p>${forwardMessage.replace(/\n/g, '<br>')}</p><br>`;
                    }
                    htmlBody += `<div>---------- Forwarded message ---------<br>${fwdHeader}<br><br></div>`;
                    if (rawBody.isHtml) {
                        htmlBody += rawBody.body;
                    } else {
                        htmlBody += `<pre>${rawBody.body}</pre>`;
                    }

                    // Check for attachments to include
                    const attachments = EmailUtils.getAttachments(email);
                    let rawEmail;

                    if (attachments.length > 0) {
                        // Build multipart MIME message with attachments
                        const boundary = 'boundary_' + Date.now() + '_' + Math.random().toString(36).substr(2);

                        const headers = [
                            `To: ${toAddress}`,
                            `Subject: ${fwdSubject}`,
                            `In-Reply-To: ${messageId}`,
                            `References: ${references}`,
                            'MIME-Version: 1.0',
                            `Content-Type: multipart/mixed; boundary="${boundary}"`,
                            '',
                            `--${boundary}`,
                            'Content-Type: text/html; charset=UTF-8',
                            '',
                            htmlBody
                        ];

                        // Fetch and attach each attachment
                        for (const att of attachments) {
                            try {
                                const base64Data = await this.gmail.getAttachment(email.id, att.attachmentId);
                                if (base64Data) {
                                    // Gmail API returns url-safe base64; convert to standard base64 for MIME
                                    const standardBase64 = base64Data.replace(/-/g, '+').replace(/_/g, '/');
                                    // Split into 76-char lines per MIME spec
                                    const wrapped = standardBase64.match(/.{1,76}/g)?.join('\n') || standardBase64;
                                    headers.push(
                                        `--${boundary}`,
                                        `Content-Type: ${att.mimeType}; name="${att.filename}"`,
                                        `Content-Disposition: attachment; filename="${att.filename}"`,
                                        'Content-Transfer-Encoding: base64',
                                        '',
                                        wrapped
                                    );
                                }
                            } catch (attErr) {
                                console.warn('Could not attach file:', att.filename, attErr);
                            }
                        }

                        headers.push(`--${boundary}--`);
                        rawEmail = headers.join('\n');
                    } else {
                        // Simple email without attachments (original behavior)
                        rawEmail = [
                            `To: ${toAddress}`,
                            `Subject: ${fwdSubject}`,
                            `In-Reply-To: ${messageId}`,
                            `References: ${references}`,
                            'Content-Type: text/html; charset=UTF-8',
                            '',
                            htmlBody
                        ].join('\n');
                    }

                    await this.gmail.sendEmail(rawEmail, email.threadId);

                    this.model.setState('idle');
                    this.view.updateStatus('Waiting for command');
                    this.speech.speak('Email forwarded. What would you like to do with this email now?');
                } catch (e) {
                    console.error('Forward error:', e);
                    this.speech.speak('Sorry, I could not forward that email.');
                    this.model.setState('idle');
                }
            }

            // ========== UNSUBSCRIBE ==========
            async handleUnsubscribe() {
                this.speech.clearResumeState(); // Clear resume state when taking action on email
                const fullBody = EmailUtils.extractFullBody(this.model.currentEmail.payload);
                const match = fullBody.match(/https?:\/\/[^\s<>"]+unsubscribe[^\s<>"]*/i);

                if (match) {
                    await this.speech.speak('I found an unsubscribe link. I will click it. You may need to take some action in your browser.');
                    this.view.updateStatus('Opening unsubscribe link...');
                    window.open(match[0], '_blank');
                    await this.speech.speak('Link opened. What would you like to do with this email?');
                    return; // Wait for user's next command (e.g., archive, next, etc.)
                } else {
                    await this.speech.speak('I could not find an unsubscribe link in this email. Marking as red so you can find it later.'); // Intentional: "red" not "read" for correct TTS pronunciation
                    try {
                        await this.gmail.modifyEmail(this.model.currentEmail.id, [], ['UNREAD']);
                    } catch (e) {
                        await this.speech.speak('Sorry, I could not mark that email as red.'); // Intentional: "red" not "read" for correct TTS pronunciation
                        return;
                    }
                    await this.speech.speak('Marked as red. Moving to next email.'); // Intentional: "red" not "read" for correct TTS pronunciation
                    this.model.setCurrentEmailIndex(this.model.currentEmailIndex + 1);
                    this.readCurrentEmail();
                }
            }

            // ========== ATTACHMENTS ==========
            hasReadableAttachments() {
                if (!this.model.currentEmail) return false;
                const attachments = EmailUtils.getAttachments(this.model.currentEmail);
                return attachments.some(att => EmailUtils.isReadableAttachment(att));
            }

            getReadableAttachments() {
                if (!this.model.currentEmail) return [];
                const attachments = EmailUtils.getAttachments(this.model.currentEmail);
                return attachments.filter(att => EmailUtils.isReadableAttachment(att));
            }

            async readAttachments() {
                const readableAttachments = this.getReadableAttachments();

                if (readableAttachments.length === 0) {
                    await this.speech.speak('This email has no readable attachments.');
                    return;
                }

                // Set state so Stop button appears and Read Attachments button hides
                this.model.setState('reading-attachment');
                this.view.updateStatus('Extracting attachment text...');

                // Announce
                if (readableAttachments.length === 1) {
                    await this.speech.speak(`Reading ${readableAttachments[0].filename}. Please wait while I extract the text.`);
                } else {
                    await this.speech.speak(`Reading ${readableAttachments.length} attachments.`);
                }

                if (this.model.state !== 'reading-attachment') {
                    this.view.updateStatus('Stopped reading attachments');
                    return;
                }

                // For each attachment: extract/OCR, then immediately read it out loud
                // before moving on to the next.
                for (let i = 0; i < readableAttachments.length; i++) {
                    if (this.model.state !== 'reading-attachment') {
                        this.view.updateStatus('Stopped reading attachments');
                        return;
                    }

                    const attachment = readableAttachments[i];
                    this.view.updateStatus(`Extracting ${attachment.filename}...`);

                    let result = await this.gmail.extractAttachmentText(
                        this.model.currentEmail.id,
                        attachment
                    );

                    // OCR fallback for scanned (image-based) PDFs
                    if (!result.success && result.needsOcr) {
                        const pageWord = result.numPages === 1 ? 'page' : 'pages';
                        await this.speech.speak(
                            `${attachment.filename} is a scanned image, not text. Running OCR on ${result.numPages} ${pageWord}. This may take a few minutes. Say Stop to cancel.`
                        );

                        if (this.model.state !== 'reading-attachment') {
                            this.view.updateStatus('Stopped reading attachments');
                            return;
                        }

                        result = await this.gmail.extractPdfTextViaOcr(
                            result.base64Data,
                            (msg) => {
                                this.view.updateStatus(msg);
                                return this.model.state !== 'reading-attachment';
                            }
                        );
                    }

                    if (this.model.state !== 'reading-attachment') {
                        this.view.updateStatus('Stopped reading attachments');
                        return;
                    }

                    const header = readableAttachments.length > 1
                        ? `Attachment ${i + 1} of ${readableAttachments.length}: ${attachment.filename}.\n\n`
                        : `${attachment.filename}.\n\n`;
                    const attachmentText = result.success
                        ? header + result.text
                        : header + `Sorry, I could not read this attachment. ${result.error}`;

                    // Display this attachment on screen and read it before moving on
                    this.model.attachmentDisplayText = attachmentText;
                    this.view.setEmailBodyText(attachmentText);
                    this.view.updateStatus(`Reading ${attachment.filename}...`);
                    const textForSpeech = EmailUtils.stripUrlsForSpeech(attachmentText);
                    await this.speech.speakWithScroll(textForSpeech, this.view, 0);

                    if (this.speech.isCancelled || this.model.state !== 'reading-attachment') {
                        this.view.updateStatus('Stopped reading attachments');
                        return;
                    }
                }

                // Finished naturally
                this.model.attachmentDisplayText = null;
                this.view.updateStatus('Finished reading attachments');
                await this.speech.speak('Finished reading attachments. What would you like to do with this email?');
                this.model.setState('idle');
            }
        }

        // ============================================================
        // APP INITIALIZATION
        // ============================================================
        const model = new EmailReaderModel();
        const view = new EmailReaderView();
        const gmail = new GmailService(model);
        const speech = new SpeechService();
        const app = new EmailReaderController(model, view, gmail, speech);

        window.onload = () => {
            app.init();

            // Timeout check: if still initializing after 8 seconds, show error
            setTimeout(() => {
                if (model.state === 'initializing') {
                    console.error('Timeout: Google Identity Services may be blocked');
                    const ctaEl = document.querySelector('.welcome-cta');
                    if (ctaEl) {
                        ctaEl.innerHTML = '⚠️ Google sign-in is not loading.<br><br>This may be caused by content blockers or your browser privacy settings.<br><br>Things to try: (1) Reload your browser. (2) Disable pop-up blockers for this site. (3) Switch to a different browser.';
                        ctaEl.style.fontSize = '18px';
                    }
                }
            }, 8000);
        };
    </script>
</body>
</html>
