                    // with the refused request, so renew and send it once more.
                    await this.renewToken();
                    response = await this.fetchWithRetry(url, options, canRepeat);
                }
                return response;
            }

            // Retries after a short wait when the request never reached Gmail (no
            // signal) or Gmail answered "too busy" (429) or had a hiccup (5xx).
            // A 429 means Gmail did nothing, so even a send is safe to repeat; the
            // other cases are repeated only when canRepeat is true.
            async fetchWithRetry(url, options, canRepeat) {
                const retryDelaysMs = [1000, 2000, 4000];
                for (let attempt = 0; ; attempt++) {
                    const lastTry = attempt >= retryDelaysMs.length;
                    try {
                        const response = await fetch(url, {
                            ...options,
                            headers: {
                                'Authorization': `Bearer ${this.model.accessToken}`,
                                'Content-Type': 'application/json',
                                ...options.headers
                            }
                        });
                        const worthRetrying = response.status === 429 || (canRepeat && response.status >= 500);
                        if (!worthRetrying || lastTry) return response;
                    } catch (e) {
                        if (!canRepeat || lastTry) throw e;
                    }
                    await new Promise(r => setTimeout(r, retryDelaysMs[attempt]));
                }
            }

            // One page of unread inbox email IDs, newest first. Cheap: Gmail returns
            // only the IDs here, not the emails.
            async listUnreadIds(pageToken = null) {
                let url = `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${encodeURIComponent('is:unread in:inbox')}&maxResults=100`;
                if (pageToken) url += `&pageToken=${encodeURIComponent(pageToken)}`;

                const response = await this.fetchWithAuth(url);
                if (!response.ok) throw new Error(`Gmail could not list emails (HTTP ${response.status})`);
                const data = await response.json();
                return {
                    ids: (data.messages || []).map(m => m.id),
                    nextPageToken: data.nextPageToken || null
                };
            }

            // Up to `limit` unread inbox emails, newest first, leaving out any whose ID
            // is in skipIds (the emails already fetched this session). Pages through
            // Gmail's list as far as needed, so emails left unread with "next" can't
            // crowd out older ones. Returns an empty list ONLY when Gmail itself says
            // there are no more; any failure throws, so a problem can never be
            // announced as the end of the inbox.
            async fetchUnreadEmails(skipIds = new Set(), limit = 50) {
                const wantedIds = [];
                let pageToken = null;
                let pages = 0;
                do {
                    if (++pages > 200) throw new Error('Gave up after 200 pages of Gmail results');
                    const page = await this.listUnreadIds(pageToken);
                    for (const id of page.ids) {
                        if (!skipIds.has(id) && !wantedIds.includes(id)) wantedIds.push(id);
                    }
                    pageToken = page.nextPageToken;
                } while (pageToken && wantedIds.length < limit);

                const emails = [];
                let failures = 0;
                let lastError = null;
                for (const id of wantedIds.slice(0, limit)) {
                    try {
                        const emailResponse = await this.fetchWithAuth(
                            `https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=full`
                        );
                        if (emailResponse.ok) {
                            emails.push(await emailResponse.json());
                        } else if (emailResponse.status !== 404) { // 404 = deleted since it was listed
                            failures++;
                            lastError = new Error(`Gmail could not open an email (HTTP ${emailResponse.status})`);
                        }
                    } catch (e) {
                        failures++;
                        lastError = e;
                    }
                    await new Promise(r => setTimeout(r, 100)); // Rate limit
                }
                // An email that won't open is skipped; it stays unread, so a later fetch
                // tries it again. But if none opened, report the failure rather than an
                // empty list that would sound like the end of the inbox.
                if (emails.length === 0 && failures > 0) throw lastError;
                return emails;
            }

            async modifyEmail(emailId, addLabels = [], removeLabels = []) {
                const body = {};
                if (addLabels.length) body.addLabelIds = addLabels;
                if (removeLabels.length) body.removeLabelIds = removeLabels;

                const response = await this.fetchWithAuth(
                    `https://gmail.googleapis.com/gmail/v1/users/me/messages/${emailId}/modify`,
                    { method: 'POST', body: JSON.stringify(body) }
                );
                // Throwing lets the caller say "Sorry, I could not archive that email"
                // instead of announcing an archive that never happened.
                if (!response.ok) throw new Error(`Gmail could not change the email (HTTP ${response.status})`);
            }

            async sendEmail(rawEmail, threadId = null) {
                const body = { raw: EmailUtils.encodeEmail(rawEmail) };
                if (threadId) body.threadId = threadId;

                const response = await this.fetchWithAuth(
                    'https://gmail.googleapis.com/gmail/v1/users/me/messages/send',
                    { method: 'POST', body: JSON.stringify(body) },
                    { canRepeat: false }
                );
                if (!response.ok) throw new Error(`Gmail could not send the email (HTTP ${response.status})`);
            }

            async getMyEmail() {
                if (this.model.userEmail) return this.model.userEmail;
                const response = await this.fetchWithAuth(
                    'https://gmail.googleapis.com/gmail/v1/users/me/profile'
                );
                const data = await response.json();
                this.model.userEmail = data.emailAddress || '';
                return this.model.userEmail;
            }

            async getRecentRecipients(maxResults = 6) {
                if (this.model.recentRecipients) return this.model.recentRecipients;

                try {
                    const response = await this.fetchWithAuth(
                        `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=in:sent&maxResults=20`
                    );
                    const data = await response.json();
                    if (!data.messages) return [];

                    const recipients = new Set();
                    const myEmail = await this.getMyEmail();

                    for (let msg of data.messages) {
                        if (recipients.size >= maxResults) break;
                        try {
                            const emailResponse = await this.fetchWithAuth(
                                `https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}?format=metadata&metadataHeaders=To&metadataHeaders=Cc`
                            );
                            if (emailResponse.ok) {
                                const email = await emailResponse.json();
                                const to = EmailUtils.getHeader(email, 'To');
                                const cc = EmailUtils.getHeader(email, 'Cc');

                                (to + ',' + cc).split(',')
                                    .map(addr => addr.trim())
                                    .filter(addr => addr && !addr.toLowerCase().includes(myEmail.toLowerCase()))
                                    .filter(addr => {
                                        const emailMatch = addr.match(/<([^>]+)>/);
                                        const emailAddr = (emailMatch ? emailMatch[1] : addr).toLowerCase();
                                        // Skip unsubscribe emails
                                        if (emailAddr.includes('unsubscribe')) return false;
                                        if (emailAddr.startsWith('unsub')) return false;
                                        // Skip auto-generated/tracking addresses (long random local parts)
                                        const localPart = emailAddr.split('@')[0];
                                        if (localPart.length > 25) return false;
                                        return true;
                                    })
                                    .forEach(addr => {
                                        if (recipients.size < maxResults) {
                                            const match = addr.match(/<([^>]+)>/);
                                            if ((match ? match[1] : addr).includes('@')) {
                                                recipients.add(addr);
                                            }
                                        }
                                    });
                            }
                            await new Promise(r => setTimeout(r, 50));
                        } catch (e) {}
                    }

                    this.model.recentRecipients = Array.from(recipients);
                    return this.model.recentRecipients;
                } catch (e) {
                    return [];
                }
            }

            async searchForEmail(name) {
                try {
                    const response = await this.fetchWithAuth(
                        `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${encodeURIComponent(name)}&maxResults=10`
                    );
                    const data = await response.json();
                    if (!data.messages) return null;

                    // Prepare spoken words for matching
                    const spokenWords = name.toLowerCase().split(/\s+/).filter(w => w.length > 1);

                    // Check multiple messages to find one that actually matches the query
                    for (const msg of data.messages) {
                        const msgResponse = await this.fetchWithAuth(
                            `https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}?format=metadata&metadataHeaders=To&metadataHeaders=From&metadataHeaders=Cc`
                        );
                        const message = await msgResponse.json();

                        const to = EmailUtils.getHeader(message, 'To') || '';
                        const from = EmailUtils.getHeader(message, 'From') || '';
                        const cc = EmailUtils.getHeader(message, 'Cc') || '';
                        const allAddresses = to + ' ' + from + ' ' + cc;

                        // Extract all email addresses with their display names
                        const addressPattern = /(?:([^<,]+)\s*)?<?([\w\.-]+@[\w\.-]+\.\w+)>?/g;
                        let addrMatch;
                        while ((addrMatch = addressPattern.exec(allAddresses)) !== null) {
                            const displayName = (addrMatch[1] || '').trim();
                            const email = addrMatch[2];
                            const emailUsername = email.split('@')[0].replace(/[._]/g, ' ');
                            const searchText = (displayName + ' ' + emailUsername).toLowerCase();

                            // Check if any spoken word matches this address
                            for (const word of spokenWords) {
                                if (searchText.includes(word)) {
                                    return email; // Found a validated match!
                                }
                            }
                        }
                    }

                    // No validated match found in any of the results
                    return null;
                } catch (e) {
                    return null;
                }
            }

            initAuth(onSuccess, onError) {
                // Check if Google Identity Services loaded
                if (typeof google === 'undefined' || !google.accounts) {
                    console.error('Google Identity Services not loaded');
                    if (onError) onError('Google sign-in is not available. Please check if content blockers are disabled for this site.');
                    return;
                }

                try {
                    google.accounts.id.initialize({
                        client_id: this.model.clientId,
                        callback: () => {}
                    });

                    // The same token client serves the first sign-in and every renewal
                    // (see renewToken), so its callbacks check which one is under way.
                    let signedIn = false;
                    this.tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: this.model.clientId,
                        scope: this.SCOPES,
                        callback: (response) => {
                            if (response.access_token) {
                                this.model.setAccessToken(response.access_token);
                                // expires_in is the pass's lifetime in seconds (an hour)
                                this.tokenExpiresAt = Date.now() + (Number(response.expires_in) || 3600) * 1000;
                                if (this.renewal) {
                                    this.finishRenewal();
                                } else if (!signedIn) {
                                    signedIn = true;
                                    onSuccess();
                                }
                            } else if (response.error) {
                                console.error('OAuth error:', response.error);
                                if (this.renewal) {
                                    this.renewalAttemptFailed();
                                } else if (onError) {
                                    onError('Sign-in failed: ' + response.error);
                                }
                            }
                        },
                        error_callback: (error) => {
                            console.error('OAuth error callback:', error);
                            if (this.renewal) {
                                this.renewalAttemptFailed();
                            } else if (onError) {
                                onError('Sign-in error: ' + (error.message || 'Unknown error'));
                            }
                        }
                    });

                    this.tokenClient.requestAccessToken();
                } catch (e) {
                    console.error('initAuth exception:', e);
                    if (onError) onError('Sign-in initialization failed: ' + e.message);
                }
            }

            // Get a fresh sign-in pass. The returned promise settles only when a new
            // pass arrives, so the Gmail call that needed it simply waits and then
            // carries on: an archive or reply asked for at the one-hour mark is
            // finished, not lost.
            //
            // First try: ask Google the same way the app signs in at page load, with
            // no tap. That works wherever the browser lets this site open Google's
            // sign-in window on its own, which it must for the page-load sign-in to
            // work. Google's documentation says a new pass should come "from a
            // user-driven event such as a button press," so if the no-tap try fails,
            // the controller asks Alene to tap the screen, and the tap calls
            // renewFromTap(). prompt '' skips the consent screen after the first time;
            // login_hint skips the account chooser.
            renewToken() {
                if (this.renewal) return this.renewal.promise;
                if (!this.tokenClient) return Promise.reject(new Error('Not signed in'));

                let resolve;
                const promise = new Promise(r => { resolve = r; });
                this.renewal = { promise, resolve, needsTap: false, timer: null };
                // If Google hasn't answered in 15 seconds (for example, its window is
                // waiting for a password), ask for a tap instead of waiting in silence.
                this.renewal.timer = setTimeout(() => this.renewalAttemptFailed(), 15000);
                this.requestNewToken();
                return promise;
            }

            requestNewToken() {
                try {
                    this.tokenClient.requestAccessToken({
                        prompt: '',
                        login_hint: this.model.userEmail || undefined
                    });
                } catch (e) {
                    console.error('requestAccessToken failed:', e);
                    this.renewalAttemptFailed();
                }
            }

            // Called by the "tap to renew" screen. Must run inside the tap itself:
            // browsers open Google's sign-in window only during a tap.
            renewFromTap() {
                if (this.renewal) this.requestNewToken();
            }

            renewalAttemptFailed() {
                const renewal = this.renewal;
                if (!renewal) return;
                clearTimeout(renewal.timer);
                renewal.timer = null;
                if (!renewal.needsTap) {
                    renewal.needsTap = true;
                    if (this.onRenewalNeedsTap) this.onRenewalNeedsTap();
                } else if (this.onRenewalTapFailed) {
                    this.onRenewalTapFailed();
                }
            }

            finishRenewal() {
                const renewal = this.renewal;
                this.renewal = null;
                clearTimeout(renewal.timer);
                if (renewal.needsTap && this.onRenewalDone) this.onRenewalDone();
                renewal.resolve();
            }

            signOut() {
                google.accounts.id.disableAutoSelect();
                this.model.setAccessToken(null);
                this.tokenExpiresAt = 0;
            }

            // ===== Mishearing log (see the MISHEARING LOG banner) =====

            // True while the sign-in pass has more than the renewal margin left,
            // so a background call cannot set off the "tap to renew" screen.
            hasFreshToken() {
                return this.model.isAuthenticated
                    && Date.now() < this.tokenExpiresAt - this.TOKEN_RENEW_MARGIN_MS;
            }

            // The label the notes are filed under: found, or made the first time.
            // It stays out of Gmail's sidebar unless something in it is unread,
            // and nothing in it ever is.
            async getMishearingLabelId() {
                if (this.mishearingLabelId) return this.mishearingLabelId;
                const url = 'https://gmail.googleapis.com/gmail/v1/users/me/labels';
                const listResponse = await this.fetchWithAuth(url);
                if (!listResponse.ok) return null;
                const labels = (await listResponse.json()).labels || [];
                const existing = labels.find(l => l.name === MISHEARING_LABEL_NAME);
                if (existing) return (this.mishearingLabelId = existing.id);
                const createResponse = await this.fetchWithAuth(url, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: MISHEARING_LABEL_NAME,
                        labelListVisibility: 'labelShowIfUnread',
                        messageListVisibility: 'show'
                    })
                }, { canRepeat: false });
                if (!createResponse.ok) return null;
                return (this.mishearingLabelId = (await createResponse.json()).id || null);
            }

            // File one note in Alene's mailbox under the label. messages.insert
            // stores a message without sending it, and with only this label the
            // note is out of the inbox and already read. canRepeat: false, because
            // repeating after a lost connection could file it twice. True once
            // Gmail has the note, and also when Gmail refuses it as malformed
            // (400): that note would be refused forever, and it must not hold up
            // the notes behind it.
            async insertMishearingNote(entry) {
                const labelId = await this.getMishearingLabelId();
                if (!labelId) return false;
                const response = await this.fetchWithAuth(
                    'https://gmail.googleapis.com/gmail/v1/users/me/messages',
                    {
                        method: 'POST',
                        body: JSON.stringify({
                            raw: EmailUtils.encodeEmail(buildMishearingNote(entry)),
                            labelIds: [labelId]
                        })
                    },
                    { canRepeat: false }
                );
                if (response.status === 400) console.warn('Mishearing log: Gmail refused a note:', entry);
                return response.ok || response.status === 400;
            }

            // Fetch attachment data
            async getAttachment(messageId, attachmentId) {
                const response = await this.fetchWithAuth(
                    `https://gmail.googleapis.com/gmail/v1/users/me/messages/${messageId}/attachments/${attachmentId}`
                );
                if (response.ok) {
                    const data = await response.json();
                    return data.data; // Base64 encoded attachment data
                }
                return null;
            }

            // Extract text from attachment
            async extractAttachmentText(messageId, attachment) {
                const base64Data = await this.getAttachment(messageId, attachment.attachmentId);
                if (!base64Data) {
                    return { success: false, error: 'Could not download attachment' };
                }

                const filename = attachment.filename.toLowerCase();
                const mimeType = attachment.mimeType.toLowerCase();

                try {
                    // Handle text files
                    if (filename.endsWith('.txt') || filename.endsWith('.md') || filename.endsWith('.csv') ||
                        mimeType === 'text/plain' || mimeType === 'text/csv' || mimeType === 'text/markdown') {
                        const text = EmailUtils.decodeBase64UTF8(base64Data);
                        return { success: true, text: text };
                    }

                    // Handle PDF files
                    if (filename.endsWith('.pdf') || mimeType === 'application/pdf') {
                        return await this.extractPdfText(base64Data);
                    }

                    // Handle Word documents (.docx)
                    if (filename.endsWith('.docx') ||
                        mimeType === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
                        return await this.extractDocxText(base64Data);
                    }

                    return { success: false, error: 'Unsupported file type' };
                } catch (e) {
                    console.error('Error extracting attachment text:', e);
                    return { success: false, error: 'Failed to read attachment' };
                }
            }

            // Extract text from PDF using pdf.js
            async extractPdfText(base64Data) {
                try {
                    // Check if pdf.js is loaded
                    if (typeof pdfjsLib === 'undefined') {
                        return { success: false, error: 'PDF reader not available' };
                    }

                    // Convert base64 to Uint8Array
                    const binaryString = atob(base64Data.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    // Load the PDF
                    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
                    let fullText = '';

                    // Extract text from each page
                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += pageText + '\n\n';
                    }

                    if (fullText.trim().length === 0) {
                        return {
                            success: false,
                            error: 'PDF appears to be image-based or empty. Cannot extract text.',
                            needsOcr: true,
                            base64Data: base64Data,
                            numPages: pdf.numPages
                        };
                    }

                    return { success: true, text: fullText.trim() };
                } catch (e) {
                    console.error('PDF extraction error:', e);
                    return { success: false, error: 'Failed to read PDF file' };
                }
            }

            // Extract text from PDF using OCR (Tesseract.js) for scanned/image-based PDFs.
            // onProgress(msg) is called before each page; if it returns truthy, OCR aborts.
            async extractPdfTextViaOcr(base64Data, onProgress) {
                try {
                    if (typeof pdfjsLib === 'undefined') {
                        return { success: false, error: 'PDF reader not available' };
                    }
                    if (typeof Tesseract === 'undefined') {
                        return { success: false, error: 'OCR engine not available. Please check your internet connection.' };
                    }

                    const binaryString = atob(base64Data.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
                    const numPages = pdf.numPages;

                    if (onProgress && onProgress('Loading OCR engine...')) {
                        return { success: false, error: 'OCR stopped by user.' };
                    }
                    const worker = await Tesseract.createWorker('eng');

                    let fullText = '';
                    try {
                        for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                            if (onProgress && onProgress(`OCRing page ${pageNum} of ${numPages}...`)) {
                                return { success: false, error: 'OCR stopped by user.' };
                            }

                            const page = await pdf.getPage(pageNum);
                            const viewport = page.getViewport({ scale: 2.0 });

                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            const ctx = canvas.getContext('2d');

                            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                            const { data: { text } } = await worker.recognize(canvas);
                            fullText += text + '\n\n';
                        }
                    } finally {
                        await worker.terminate();
                    }

                    if (fullText.trim().length === 0) {
                        return { success: false, error: 'OCR completed but no text could be extracted.' };
                    }

                    return { success: true, text: fullText.trim() };
                } catch (e) {
                    console.error('PDF OCR error:', e);
                    return { success: false, error: 'Failed to OCR PDF file: ' + (e.message || e) };
                }
            }

            // Extract text from Word document using mammoth.js
            async extractDocxText(base64Data) {
                try {
                    // Check if mammoth is loaded
                    if (typeof mammoth === 'undefined') {
                        return { success: false, error: 'Word document reader not available' };
                    }

                    // Convert base64 to ArrayBuffer
                    const binaryString = atob(base64Data.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const arrayBuffer = bytes.buffer;

                    // Extract text using mammoth
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });

                    if (result.value && result.value.trim().length > 0) {
                        return { success: true, text: result.value.trim() };
                    } else {
                        return { success: false, error: 'Word document appears to be empty or contains only images.' };
                    }
                } catch (e) {
                    console.error('Word document extraction error:', e);
                    return { success: false, error: 'Failed to read Word document' };
                }
            }
        }

        // ============================================================
        // END-OF-DICTATION ("done") DETECTION
        // ------------------------------------------------------------
        // The signal that the user has finished dictating is the spoken
        // word "done". It reaches the app in two shapes:
        //
        //   1. On its own — the speech API returns a final result that is
        //      just "done", because the user paused before saying it.
        //   2. Riding along at the end of the message — "thank you so
        //      much! done" arrives as ONE final result, because it was all
        //      said in one breath, leaving no pause for the speech API to
        //      split on.
        //
        // Only shape 1 used to be recognized, so shape 2 left the word
        // "done" sitting in the middle of the email (reported 2026-07-30
        // with a screenshot of a reply reading "Thank you so much! Done").
        // Shape 1 also missed "done." — the exact-match check it used could
        // not see past punctuation the speech API tacked on.
        //
        // The thing to avoid in shape 2 is cutting a message that
        // legitimately ends in "done" ("the draft is done"), so two signals
        // decide it:
        //   - Sentence-ending punctuation before the word ("so much! done")
        //     means a new utterance started. Confident: treat it as the signal.
        //   - Otherwise, look at the word just before it. Words like "is",
        //     "all", or "it" make "done" part of the sentence, so the text is
        //     left alone and dictation keeps going.
        // The multi-word phrases are held to the stricter standard: inside a
        // longer utterance they only count as the stop signal when sentence-
        // ending punctuation precedes them, because "I think that's it" and
        // "please tell her I'm done" are things someone may well want to say.
        // ============================================================

        // Longest phrases first, so "i'm done" wins over the bare "done".
        const DICTATION_DONE_PHRASES = ["i'm done", "i'm finished", "that's it", "done", "finished"];

        // The bare words are the ones ambiguous enough to need the lead-in
        // check below; the rest require punctuation. See the banner above.
        const DICTATION_DONE_BARE_PHRASES = new Set(['done', 'finished']);

        // Words that make a trailing "done" / "finished" part of the sentence
        // rather than a stop signal ("the draft is done", "consider it done",
        // "we're almost done"). Only consulted when no sentence-ending
        // punctuation separates the two.
        const DICTATION_DONE_CONTENT_LEAD_INS = new Set([
            'is', 'are', 'am', 'was', 'were', 'be', 'been', 'being',
            'get', 'gets', 'got', 'getting', 'gotten', 'have', 'has', 'had',
            'it', 'this', 'that', 'them', 'everything', 'anything', 'something', 'nothing',
            'all', 'well', 'almost', 'nearly', 'not', 'never', 'already', 'half', 'mostly',
            'and', 'or', 'when', 'once', 'until', 'nothing',
            "we're", "you're", "they're", "he's", "she's", "it's", "i've", "we've", "isn't", "aren't"
        ]);

        const DICTATION_DONE_ALTERNATION = DICTATION_DONE_PHRASES
            .map(phrase => phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+'))
            .join('|');

        // The whole utterance is the stop signal. Trailing punctuation the
        // speech API tacked on is allowed: "done", "Done.", "done!".
        const DICTATION_DONE_ONLY_RE =
            new RegExp(`^[\\s,]*(?:${DICTATION_DONE_ALTERNATION})[\\s.!?,]*$`, 'i');

        // The stop signal sits at the end of a longer utterance. The \b guards
        // keep words like "undone" and "abandoned" from matching.
        const DICTATION_DONE_TRAILING_RE =
            new RegExp(`^(.*?)\\s*[,;:]?\\s*\\b(${DICTATION_DONE_ALTERNATION})\\b[\\s.!?,]*$`, 'i');

        // Returns null when `text` is not an end-of-dictation signal.
        // Otherwise returns { keep } — the message text to commit before
        // finishing, which is '' when the whole utterance was the signal.
        function detectDictationDoneSignal(text) {
            // iOS sometimes returns a curly apostrophe, so straighten it before
            // matching. The replacement is one character for one, so positions
            // still line up with the original text.
            const normalized = (text || '').replace(/[‘’]/g, "'");
            if (!normalized.trim()) return null;
            if (DICTATION_DONE_ONLY_RE.test(normalized)) return { keep: '' };

            const match = normalized.match(DICTATION_DONE_TRAILING_RE);
            if (!match) return null;

            // Read the kept words back out of the ORIGINAL text, so a curly
            // apostrophe the user dictated survives into the message.
            const keep = text.slice(0, match[1].length).trim();
            if (!/[a-z0-9]/i.test(keep)) return null;

            const phrase = match[2].toLowerCase().replace(/\s+/g, ' ');
            const endsSentence = /[.!?]["')\]]*$/.test(keep);
            if (!endsSentence) {
                if (!DICTATION_DONE_BARE_PHRASES.has(phrase)) return null;
                const words = keep.toLowerCase().split(/[^a-z']+/).filter(Boolean);
                if (DICTATION_DONE_CONTENT_LEAD_INS.has(words[words.length - 1])) return null;
            }
            return { keep };
        }

        // ============================================================
        // MID-SENTENCE PAUSES AND STRAY CAPITAL LETTERS
        // ------------------------------------------------------------
        // A pause splits one spoken sentence into two recognition results,
        // and the speech API capitalizes the first word of every result. So
        // pausing after "we filed the motion" and continuing "and served it"
        // puts a capital A in the middle of the sentence. `capitalizeForContext`
        // undoes that, but ONLY for the words below — words that essentially
        // never begin a sentence. Anything not listed keeps whatever case the
        // speech API gave it, which is what protects a name ("Kathryn"), an
        // acronym ("LIC"), and "I" from being lowercased by mistake.
        //
        // If a stray capital still gets through, the fix is to add that word
        // here. Two kinds of word to leave OUT: any word that could be a name
        // or a month ("May", "Will", "Drew", "Sage"), and any word Alene may
        // genuinely start a sentence with ("However", "Thanks", "This").
        // ============================================================
        const DICTATION_MID_SENTENCE_LOWERCASE = new Set([
            // Conjunctions and complementizers
            'and', 'but', 'or', 'nor', 'so', 'yet', 'because', 'although', 'though',
            'while', 'whereas', 'since', 'unless', 'until', 'till', 'if', 'whether',
            'than', 'as', 'that', 'which', 'whom', 'whose',
            // Articles and determiners
            'the', 'a', 'an', 'another', 'any', 'some', 'each', 'every', 'both',
            'either', 'neither', 'such',
            // Prepositions
            'about', 'above', 'across', 'after', 'against', 'along', 'among', 'amongst',
            'around', 'at', 'before', 'behind', 'below', 'beneath', 'beside', 'besides',
            'between', 'beyond', 'by', 'despite', 'down', 'during', 'except', 'for',
            'from', 'in', 'inside', 'into', 'like', 'near', 'of', 'off', 'on', 'onto',
            'out', 'outside', 'over', 'past', 'per', 'regarding', 'through', 'throughout',
            'to', 'toward', 'towards', 'under', 'underneath', 'up', 'upon', 'versus',
            'via', 'with', 'within', 'without',
            // Auxiliary and linking verbs ('may' is left out — it is also a month)
            'is', 'are', 'was', 'were', 'be', 'been', 'being', 'am', 'do', 'does',
            'did', 'doing', 'have', 'has', 'had', 'having', 'can', 'could', 'will',
            'would', 'shall', 'should', 'might', 'must', 'ought',
            // Adverbs and particles that modify rather than open
            'not', 'just', 'also', 'only', 'very', 'really', 'still', 'again',
            'already', 'even', 'ever', 'almost', 'always', 'never', 'often',
            'sometimes', 'rather', 'quite', 'too', 'enough', 'especially',
            'particularly', 'actually', 'simply', 'back',
            // Object pronouns and reflexives (subject pronouns like "We" and
            // "They" are left out — they open sentences all the time)
            'me', 'him', 'us', 'them', 'mine', 'yours', 'hers', 'ours', 'theirs',
            'myself', 'yourself', 'himself', 'herself', 'itself', 'ourselves', 'themselves',
            // Comparatives
            'more', 'less', 'least', 'much', 'other', 'others'
        ]);

        // Words from the list above that are also people's names. These are
        // lowercased only when the word right after them is lowercase, so
        // "will send it tomorrow" is fixed but "Will Smith" is left alone.
        // Kept deliberately tiny: the same guard applied to every word would
        // miss the common case of a pause before "And Kathryn said . . .".
        const DICTATION_LOWERCASE_ALSO_A_NAME = new Set(['will']);

        // ============================================================
        // MISHEARING LOG
        // ============================================================
        // When the app says "I did not understand that command" and Alene
        // then gives a command it knows, the misheard words were often her
        // first try at that same command ("are kind," then "archive"). The
        // app files each such pairing as a small note in her own Gmail, under
        // MISHEARING_LABEL_NAME: out of the inbox, already read, and sent to
        // no one (users.messages.insert stores a message without sending
        // it). When Alene asks, Claude reads the notes with
        // ../review_mishearings.py, reviews them with her, adds the phrases
        // she approves to LEARNED_COMMAND_PHRASES below, and deletes the
        // notes. The steps are under "Mishearing log" in CLAUDE.md. Built
        // 2026-11-07.
        //
        // The Daily DPO Check leaves this label out of its search by name
        // (VOICE_READER_NOTES_EXCLUSION in daily_dpo_check.py), so a name
        // overheard in the room is never suggested as a contact. Renaming the
        // label means renaming it there and in review_mishearings.py too.
        const MISHEARING_LABEL_NAME = 'Voice Reader Mishearings';

        // review_mishearings.py finds each note's data by this marker.
        const MISHEARING_DATA_MARKER = 'VOICE-READER-MISHEARING-DATA:';

        // Who a note is from. Not Alene's own address: Gmail files anything
        // from her address under Sent, and that label cannot be taken off
        // afterward (tested 2026-11-07). The reserved .invalid domain can never
        // be anyone's mailbox.
        const MISHEARING_NOTE_FROM = 'Voice Email Reader <voice-email-reader@notes.invalid>';

        // A miss counts as a try at the next command only when each step of
        // the chain (miss, miss, command) came within this long of the next.
        const MISHEARING_CHAIN_GAP_MS = 30000;

        // A note keeps at most this many misses, the most recent ones.
        const MISHEARING_MAX_MISSES = 3;

        // Longer than this, a miss is conversation, not a try at a command:
        // the longest command phrases are three or four words.
        const MISHEARING_MAX_WORDS = 8;

        // "Play" is what Alene says after the app stops for overheard
        // conversation, so before Play only short misses count. A mishearing
        // of "play" itself is a word or two.
        const MISHEARING_MAX_WORDS_BEFORE_PLAY = 3;
        const MISHEARING_PLAY_COMMAND_IDS = new Set(['start', 'continue']);

        // Notes not yet filed (no connection, or the sign-in pass close to
        // expiring) wait in this phone's storage and go with the next note.
        const MISHEARING_QUEUE_KEY = 'voiceEmailMishearingQueue';
        const MISHEARING_QUEUE_MAX = 50;

        // Plain words for the moment a miss happened in, for the note's text.
        const MISHEARING_STATE_WORDS = {
            'reading': 'while reading an email',
            'reading-attachment': 'while reading an attachment',
            'idle': 'while paused',
            'loading': 'while loading emails',
            'welcome': 'on the welcome screen',
            'confirming-reply-type': 'while choosing reply or reply all',
            'confirming-send': 'at the send-or-edit step',
            'confirming-forward': 'while confirming a forward',
            'confirming-forward-message': 'while asking about a forward message'
        };

        // ============================================================
        // LEARNED COMMAND PHRASES
        // ============================================================
        // Mishearings Alene approved in a review of the mishearing log, by
        // command id (the ids in getAvailableCommands). Unlike the hand-built
        // lists in matchArchive() and its siblings, a learned phrase counts
        // only when it is the WHOLE thing the app heard, compared after
        // normalizeHeardPhrase(): "harsh dive" alone would archive, but a
        // sentence that happens to contain those words would not. Like every
        // command, it works only at moments when its command is available.
        // Add a phrase only after Alene approves it, in this shape:
        //     archive: ['harsh dive'],
        const LEARNED_COMMAND_PHRASES = {
            markread: ['marcus is mad'],
            leap: ['delete'],
        };

        // Lowercase, straight apostrophes, punctuation turned to spaces, one
        // space between words: "Harsh dive." and "harsh  dive" both become
        // "harsh dive". review_mishearings.py groups notes the same way.
        function normalizeHeardPhrase(text) {
            return (text || '')
                .toLowerCase()
                .replace(/[‘’]/g, "'")
                .replace(/[^a-z0-9' ]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        const LEARNED_PHRASE_COMMAND_IDS = new Map();
        for (const [commandId, phrases] of Object.entries(LEARNED_COMMAND_PHRASES)) {
            for (const phrase of phrases) {
                LEARNED_PHRASE_COMMAND_IDS.set(normalizeHeardPhrase(phrase), commandId);
            }
        }

        // The full text of one mishearing note, as Gmail stores it. A pure
        // function, so it can be tested outside the browser. It has no To or
        // Cc, and it is not from Alene's address, so the Claude Email Check,
        // which reads mail she sends to herself or to Claude for
        // instructions, can never take overheard words for one. The body is
        // base64 so the one-line data at the end survives at any length.
        function buildMishearingNote(entry) {
            const time = (iso) => new Date(iso).toLocaleTimeString('en-US',
                { hour: 'numeric', minute: '2-digit', second: '2-digit' });
            const day = new Date(entry.command.at).toLocaleDateString('en-US',
                { month: 'long', day: 'numeric', year: 'numeric' });
            const heard = entry.misses.map(m => `"${m.heard}"`).join(', ');
            const subjectHeard = heard.length > 150 ? heard.slice(0, 147) + '...' : heard;
            const command = entry.command;
            const body = [
                'The Voice Email Reader did not understand:',
                ...entry.misses.map(m => {
                    const where = MISHEARING_STATE_WORDS[m.state] || `during "${m.state}"`;
                    const quiet = m.quiet ? ', after a Stop, so it stayed silent' : '';
                    return `  - "${m.heard}" (${time(m.at)}, ${where}${quiet})`;
                }),
                command.via === 'tap'
                    ? `Then you tapped the ${command.label} button (${time(command.at)}).`
                    : `Then it heard "${command.heard}" and ran ${command.label} (${time(command.at)}).`,
                '',
                `The app filed this note on ${day}. It was not sent to anyone.`,
                'When Alene asks, Claude reviews these notes with her, teaches the',
                'app the mishearings she approves, and then deletes the notes.',
                '',
                'Data for that review (please leave the next line as it is):',
                `${MISHEARING_DATA_MARKER} ${JSON.stringify(entry)}`
            ].join('\n');
            return [
                `From: ${MISHEARING_NOTE_FROM}`,
                `Subject: ${EmailUtils.encodeHeaderValue(`Voice Reader mishearing: ${subjectHeard} → ${command.label}`)}`,
                `Date: ${new Date(command.at).toUTCString()}`,
                'MIME-Version: 1.0',
                'Content-Type: text/plain; charset=UTF-8',
                'Content-Transfer-Encoding: base64',
                '',
                btoa(unescape(encodeURIComponent(body))).match(/.{1,76}/g).join('\n')
            ].join('\n');
        }

        // ============================================================
        // CONTROLLER - Coordinates everything, defines commands
        // ============================================================
        class EmailReaderController {
            constructor(model, view, gmail, speech) {
                this.model = model;
                this.view = view;
                this.gmail = gmail;
                this.speech = speech;

                // Pending promise resolver for multi-step flows
                this.pendingResolver = null;
                this.dictationTimeout = null;
                this.dictationSilenceTimeout = null;
                this.commandCooldown = false; // Guard against accidental commands after dictation ends
                this.committedDictation = ''; // Finalized dictation text accumulated during voice input

                // Set on each button tap to swallow accidental rapid double-taps —
                // a single physical click on mobile can fire two synthetic taps,
                // and without this they'd both advance the email index, skipping
                // an unread email past the user.
                this.buttonsLockedUntil = 0;

                // Rapid-repeat voice guard (the voice analog of buttonsLockedUntil above).
                // On iPhone there is a delay between when the user speaks and when the app
                // reacts. During that delay the app keeps reading, so the user thinks it
                // did not hear them and repeats the command. Without this guard the first
                // command runs on the intended email AND the repeat runs on the NEXT email
                // (e.g. archives an email the user never meant to touch). We remember the
                // last voice command we actually ran; an identical command heard again
                // within the window below is treated as an accidental repeat and ignored.
                this.lastExecutedCommandId = null;
                this.lastExecutedCommandTime = 0;
                this.repeatCommandWindowMs = 3000; // Tunable: shrink if it eats intended repeats; grow if doubles still slip through

                // Quiet mode: ON after a deliberate Stop or Sign Out (spoken or tapped) —
                // the user has told the app to stand down, and any speech it hears next is
                // likely a human conversation in the room, not a command. While ON, speech
                // that matches no command is answered with silence instead of the spoken
                // "I did not understand that command" (the screen still shows what was
                // heard). Recognized commands still work; executing any command other than
                // stop/sign-out turns quiet mode back OFF (see the two execute funnels:
                // handleCommand and the button wrapper in getAvailableCommands).
                this.quietMode = false;

                // True after a check for more emails failed to reach Gmail, so the next
                // "play" retries that check instead of starting over (see startReading).
                this.lastCheckFailed = false;

                // Sign-in renewal: when Google's hour-long sign-in pass can't be renewed
                // without a tap, GmailService asks for the "tap to renew" screen.
                this.renewOverlay = null;
                this.stateBeforeRenewal = null;
                this.lastRenewTapTime = 0;
                this.gmail.onRenewalNeedsTap = () => this.showRenewSignIn();
                this.gmail.onRenewalTapFailed = () => this.renewSignInTapFailed();
                this.gmail.onRenewalDone = () => this.hideRenewSignIn();

                // Mishearing log (see the MISHEARING LOG banner above this class):
                // misses waiting for the next command that works, and notes not yet
                // filed in Gmail, which this phone's storage also keeps until filed.
                this.pendingMisses = [];
                this.mishearingQueue = this.loadMishearingQueue();
                this.mishearingFlushing = false;

                // Wire up speech recognition
                this.speech.onCommand = (cmd) => this.handleCommand(cmd);
                // Pure pre-check the SpeechService runs BEFORE it cancels ongoing speech,
                // so a suppressed repeat leaves the current email reading uninterrupted.
                this.speech.onCommandShouldSuppress = (cmd) => this.shouldSuppressRepeat(cmd);

                // Wire up dictation callbacks
                this.speech.onFinalDictation = (text) => this.handleDictationFinal(text);
                this.speech.onInterimDictation = (text) => this.handleDictationInterim(text);

                // Wire up model changes to view updates
                this.model.onChange(() => this.updateView());

                // Wire up dictation input events
                this.view.elements.dictationText.addEventListener('input', () => {
                    this.resetDictationTimeout();
                });

                // Detect user tapping into text area for manual editing
                this.view.elements.dictationText.addEventListener('focus', () => {
                    if (this.model.state === 'dictating') {
                        this.model.userTouchedTextArea = true;
                    }
                });
            }

            // ========== COMMAND SYSTEM ==========
            // Each command knows when it's available via isAvailable()
            // The view automatically shows buttons for available commands

            getAvailableCommands() {
                const m = this.model;
                const commands = [];

                // Define all possible commands with their availability conditions
                const allCommands = [
                    // Email action commands (only when viewing an email)
                    {

                    {
                        id: 'reply-all', icon: '👥', label: 'All',
                        voiceMatch: (cmd) => cmd.includes('all'),
                        isAvailable: () => m.state === 'confirming-reply-type',
                        execute: () => this.resolvePending('reply all')
                    },
                    {
                        id: 'send', icon: '🚀', label: 'Send',
                        voiceMatch: (cmd) => cmd.includes('send') || cmd.includes('stand') || cmd.includes('stands') || cmd.includes('sends'),
                        isAvailable: () => m.state === 'confirming-send',
                        execute: () => this.resolvePending('send')
                    },
                    {
                        id: 'edit', icon: '✏️', label: 'Edit',
                        voiceMatch: (cmd) => cmd.includes('edit') || cmd.includes('fedex') || cmd.includes('fed ex'),
                        isAvailable: () => m.state === 'confirming-send',
                        execute: () => this.resolvePending('edit')
                    },
                    {
                        id: 'cancel', icon: '✗', label: 'Cancel',
                        voiceMatch: (cmd) => cmd.includes('cancel'),
                        isAvailable: () => ['confirming-reply-type', 'confirming-send', 'confirming-forward-recipient'].includes(m.state),
                        execute: () => this.resolvePending('cancel')
                    }
                ];

                // Filter to only available commands and format for view
                for (const cmd of allCommands) {
                    if (cmd.isAvailable()) {
                        const originalExecute = cmd.execute;
                        commands.push({
                            type: 'button',
                            id: cmd.id,
                            icon: cmd.icon,
                            label: cmd.label,
                            execute: () => {
                                if (Date.now() < this.buttonsLockedUntil) {
                                    console.log('Command ignored — too soon after previous tap (preventing double-tap):', cmd.id);
                                    return;
                                }
                                this.buttonsLockedUntil = Date.now() + 1000;
                                this.speech.cancel(); // Stop any ongoing speech immediately
                                // Any tapped command re-engages the app, so quiet mode ends.
                                // stopReading()/signOut() set it back to true inside themselves.
                                this.quietMode = false;
                                // A tap just after misses counts for the mishearing log too.
                                this.noteMishearingFollowUp(cmd, 'tap', null);
                                originalExecute();
                            }
                        });
                    }
                }

                // Special case: forward recipient selection
                if (m.state === 'confirming-forward-recipient' && m.recentRecipients) {
                    for (const recipient of m.recentRecipients) {
                        const match = recipient.match(/<([^>]+)>/);
                        const email = match ? match[1] : recipient;
                        const name = match ? recipient.replace(/<[^>]+>/, '').trim() : '';

                        commands.push({
                            type: 'button',
                            icon: '👤',
                            label: name || email,
                            sublabel: email,
                            isRecipient: true,
                            execute: () => {
                                this.speech.cancel(); // Stop any ongoing speech immediately
                                this.resolvePending(recipient);
                            }
                        });
                    }

                    commands.push({
                        type: 'email-input',
                        onSubmit: (email) => {
                            this.speech.cancel(); // Stop any ongoing speech immediately
                            this.resolvePending(email);
                        }
                    });
                }

                // Store commands for voice matching
                this.currentCommands = allCommands.filter(c => c.isAvailable());

                return commands;
            }

            matchMarkAsRead(cmd) {
                return cmd.includes('marcus red') || cmd.includes('marcus read') || cmd.includes('marcus thread') || cmd.includes('mark and red') ||
                       cmd.includes('march is red') || cmd.includes('march is read') || cmd.includes('marcus rent') || cmd.includes('mark as rent') ||
                       cmd.includes('march as red') || cmd.includes('march as read') || cmd.includes('mark and read') || cmd.includes('marcus is red') ||
                       cmd.includes('mark read') || cmd.includes('mark red') || cmd.includes('marquez road') || cmd.includes('marquez read') || 
                       cmd.includes('mark as read') || cmd.includes('mark as red') || cmd.includes('bark as red') || cmd.includes('bark as read') ||
                       cmd.includes('mark is red') || cmd.includes('mark is read') || cmd.includes('mark thread') || cmd.includes('marcus rhett') || 
                       cmd.includes('marquez red') || cmd.includes('marquez thread') || cmd.includes('marquez rhett') ||  cmd.includes('market red') || 
                       cmd.includes('market read') ||  cmd.includes('market rhett') || cmd.includes('marco red') || cmd.includes('marco read') ||
                       cmd.includes('marcus road') || cmd.includes('markus road') || cmd.includes('mark as road') || cmd.includes('mark a road') ||
                       cmd.includes('march as road') || cmd.includes('market road') || cmd.includes('marco road') ||
                       cmd.includes('mark azra') || cmd.includes('marc azra') || cmd.includes('markazra') || cmd.includes('mark ezra') ||
                       cmd.includes('mark asra') || cmd.includes('mark azrah') || cmd.includes('marcus azra') || cmd.includes('march azra') ||
                       cmd.includes('mark at red') || cmd.includes('mark at read') || cmd.includes('marc at red') || cmd.includes('marc at read') ||
                       cmd.includes('march at red') || cmd.includes('march at read') || cmd.includes('bark at red') || cmd.includes('bark at read') ||
                       cmd === 'read' || cmd === 'red';
            }

            matchArchive(cmd) {
                return cmd.includes('archive') || cmd.includes('are chive') || cmd.includes('arrive') || cmd.includes('arrived') ||
                       cmd.includes('are five') || cmd.includes('our five') || cmd.includes('are by') || cmd.includes('part five') || cmd.includes('park drive') ||
                       cmd.includes('are kind') || cmd.includes('archie') || cmd.includes('our kind') || cmd.includes('our kinds') ||
                       cmd.includes('ark hive') || cmd.includes('ark ive') || cmd.includes('arthritis') ||
                       cmd.includes('barberry') || cmd.includes('our chi') ||
                       cmd.includes('our kai') || cmd.includes('our kive') || cmd.includes('archivist') || cmd.includes('arcade') ||
                       cmd.includes('file it') || cmd.includes('file this') || cmd.includes('our side') || cmd.includes('our pie') || cmd.includes('art pie') || cmd.includes('our time') || cmd.includes('or time') ||
                       cmd === 'file';
            }

            // Convert spoken punctuation words to symbols. The Web Speech API does
            // this inconsistently — sometimes "exclamation point" comes through as "!",
            // sometimes as the literal words. Force the symbol every time.
            applyDictationSubstitutions(text) {
                if (!text) return text;
                text = text.replace(/\s*\bexclamation\s+(point|mark)\b/gi, '!');
                text = text.replace(/\s*\bquestion\s+mark\b/gi, '?');
                text = text.replace(/\s*\bperiod\b/gi, '.');
                text = text.replace(/\s*\bcomma\b/gi, ',');
                // Tidy any stray space left before close-punctuation (from either
                // our substitution above or the speech API's own substitutions).
                text = text.replace(/\s+([!?,.;:)\]])/g, '$1');
                return text;
            }

            // Fix the case of the first letter of each sentence. The Web Speech
            // API is inconsistent about case, in both directions, so this goes
            // both ways too:
            //   UP — a chunk landing at the start of the box, or right after
            //   sentence-ending punctuation, gets a capital, because the API
            //   returns lowercase transcripts (especially on mobile). Letters
            //   after '. ', '! ', or '? ' inside the chunk get one as well.
            //   DOWN — a chunk landing mid-sentence gets its capital removed,
            //   because a pause ends one recognition result and the API
            //   capitalizes the first word of the next one. Only the words in
            //   DICTATION_MID_SENTENCE_LOWERCASE are lowered; see the banner
            //   above that list for why, and for how to add to it.
            capitalizeForContext(text, existing) {
                if (!text) return text;
                const trimmedExisting = (existing || '').replace(/\s+$/, '');
                const lastChar = trimmedExisting.slice(-1);
                const atSentenceStart = !trimmedExisting || /[.!?]/.test(lastChar);
                if (atSentenceStart) {
                    text = text.replace(/^(\s*)([a-z])/, (_, ws, ch) => ws + ch.toUpperCase());
                } else {
                    // The pattern requires Capital-then-lowercase, so an all-caps
                    // acronym ("LIC", "US") and an internal capital ("McDonald")
                    // never match in the first place.
                    text = text.replace(/^(\s*)([A-Z][a-z’']*)\b(.*)$/s, (whole, ws, word, rest) => {
                        const lower = word.toLowerCase();
                        if (!DICTATION_MID_SENTENCE_LOWERCASE.has(lower)) return whole;
                        if (DICTATION_LOWERCASE_ALSO_A_NAME.has(lower) && !/^\s+[a-z]/.test(rest)) return whole;
                        return ws + word.charAt(0).toLowerCase() + word.slice(1) + rest;
                    });
                }
                text = text.replace(/([.!?]\s+)([a-z])/g, (_, p, c) => p + c.toUpperCase());
                return text;
            }

            // Handle final dictation results (from continuous speech recognition in dictation mode)
            handleDictationFinal(text) {
                if (this.model.state !== 'dictating') return;

                // Spoken punctuation becomes symbols FIRST, so that a dictated
                // "thank you so much period done" carries the sentence-ending
                // punctuation the done-detection below reads as its strongest
                // signal (see the END-OF-DICTATION banner above).
                text = this.applyDictationSubstitutions(text);

                // Did the user say the stop word? It arrives either on its own
                // ("done") or at the end of the message ("thank you so much! done").
                const doneSignal = detectDictationDoneSignal(text);
                if (doneSignal) {
                    this.view.clearInterimText();
                    this.view.updateStatus('I heard you say:', `"${text}"`);
                    // Commit the words that came before the stop word, so nothing
                    // said in that same breath is lost.
                    if (doneSignal.keep) this.commitDictation(doneSignal.keep);
                    this.finishDictation();
                    return;
                }

                this.commitDictation(text);
                this.view.clearInterimText();
                this.resetDictationTimeout();
            }

            // Put finalized words into the dictation box.
            commitDictation(text) {
                const isReplacing = !this.model.userTouchedTextArea && this.view.getDictationText();
                const existingForCap = isReplacing ? '' : this.view.getDictationText();
                text = this.capitalizeForContext(text, existingForCap);

                if (isReplacing) {
                    // First speech during edit with untouched text area:
                    // clear pre-filled text and replace with new dictation
                    this.view.setDictationText(text);
                    this.committedDictation = text;
                    this.model.userTouchedTextArea = true;
                } else {
                    this.view.appendDictationText(text);
                    this.committedDictation = this.view.getDictationText();
                }
            }

            // Handle interim dictation results (show words as user speaks)
            handleDictationInterim(text) {
                if (this.model.state !== 'dictating') return;
                // Don't show interim text while TTS is playing — the mic picks up
                // the app's own voice and displaying it just clutters the screen
                if (this.speech.isSpeaking) return;
                text = this.applyDictationSubstitutions(text);
                // Keep the stop word out of the purple dictation area — it belongs
                // to the app, not to the message. handleDictationFinal shows it in
                // the status area instead.
                const doneSignal = detectDictationDoneSignal(text);
                if (doneSignal) {
                    if (!doneSignal.keep) {
                        this.view.clearInterimText();
                        return;
                    }
                    text = doneSignal.keep;
                }
                const isReplacing = !this.model.userTouchedTextArea && this.view.getDictationText();
                const existingForCap = isReplacing ? '' : this.view.getDictationText();
                this.view.showInterimText(this.capitalizeForContext(text, existingForCap));
            }

            handleCommand(spokenCommand) {
                // Guard: ignore commands during cooldown (prevents accidental sends after dictation ends)
                if (this.commandCooldown) {
                    console.log('Command ignored during cooldown:', spokenCommand);
                    return;
                }

                // While waiting for a tap to renew the Google sign-in, no voice command
                // can help (renewal needs the tap), so repeat the instruction and leave
                // it on screen.
                if (this.model.state === 'renewing-sign-in') {
                    this.speech.speak('Please tap the screen to renew your Google sign-in.');
                    return;
                }

                this.view.updateStatus('I heard you say:', `"${spokenCommand}"`);

                // Special handling for forward recipient voice search
                if (this.model.state === 'confirming-forward-recipient') {
                    if (spokenCommand.toLowerCase().includes('cancel')) {
                        this.resolvePending('cancel');
                        return;
                    }
                    // Search for the spoken name
                    this.searchAndSelectRecipient(spokenCommand);
                    return;
                }

                // Find the matching command among the available ones (see findCommandForSpeech)
                const cmd = this.findCommandForSpeech(spokenCommand);
                if (cmd) {
                    // Remember what we ran so an accidental repeat can be ignored
                    // (see shouldSuppressRepeat and the rapid-repeat guard in the constructor).
                    this.lastExecutedCommandId = cmd.id;
                    this.lastExecutedCommandTime = Date.now();
                    // Any recognized command re-engages the app, so quiet mode ends.
                    // stopReading()/signOut() set it back to true inside themselves.
                    this.quietMode = false;
                    // Misses just before this may have been tries at it (mishearing log).
                    this.noteMishearingFollowUp(cmd, 'voice', spokenCommand);
                    cmd.execute();
                    return;
                }

                // No match. Record it for the mishearing log before the state changes below.
                this.noteMiss(spokenCommand);
                // If we were reading (email or attachment), change state to idle so Play button appears
                if (['reading', 'reading-attachment'].includes(this.model.state) && this.model.hasEmail) {
                    this.model.setState('idle');
                    this.view.updateStatus('I heard you say:', `"${spokenCommand}" — Say "play" to continue`);
                }
                // In quiet mode (after a deliberate Stop or Sign Out), unmatched speech is
                // likely people talking in the room — stay silent rather than repeating
                // "I did not understand" at them. See this.quietMode in the constructor.
                if (!this.quietMode) {
                    this.speech.speak('I did not understand that command. Please try again.');
                }
            }

            // Pure pre-check (no side effects) used by SpeechService BEFORE it cancels
            // ongoing speech. Returns true when the spoken words map to the SAME command
            // we just executed, and that happened within repeatCommandWindowMs — i.e. an
            // accidental rapid repeat caused by the iPhone speech delay. Matching through
            // findCommandForSpeech, as handleCommand does, keeps the two in lockstep, so
            // the id compared here is exactly the command that would otherwise run.
            shouldSuppressRepeat(spokenCommand) {
                if (!this.lastExecutedCommandId) return false;
                if (Date.now() - this.lastExecutedCommandTime > this.repeatCommandWindowMs) return false;
                const cmd = this.findCommandForSpeech(spokenCommand);
                // No command matched, or a different command — let it through
                return !!cmd && cmd.id === this.lastExecutedCommandId;
            }

            // The ONE place that decides which available command a heard phrase
            // means. handleCommand runs the answer and shouldSuppressRepeat only
            // peeks at it, so the two always agree. A learned phrase is checked
            // first, because it is an exact, Alene-approved match for the whole
            // utterance (see LEARNED_COMMAND_PHRASES); then each command's own
            // voiceMatch, where the first match wins.
            findCommandForSpeech(spokenCommand) {
                const commands = (this.currentCommands || []).filter(c => c.voiceMatch);
                const learnedId = LEARNED_PHRASE_COMMAND_IDS.get(normalizeHeardPhrase(spokenCommand));
                const learned = learnedId ? commands.find(c => c.id === learnedId) : null;
                if (learned) return learned;
                // Use lowercase for case-insensitive matching
                const spokenLower = spokenCommand.toLowerCase();
                return commands.find(c => c.voiceMatch(spokenLower)) || null;
            }

            // ========== MISHEARING LOG ==========
            // See the MISHEARING LOG banner above this class.

            // Speech matched no available command. Keep it, with the moment it
            // happened in, in case the next command shows what Alene meant.
            noteMiss(spokenCommand) {
                try {
                    if (!this.model.isAuthenticated) return;
                    this.pendingMisses.push({
                        heard: spokenCommand,
                        at: Date.now(),
                        state: this.model.state,
                        available: (this.currentCommands || []).map(c => c.id),
                        quiet: this.quietMode
                    });
                    // Only the most recent few can ever reach a note.
                    if (this.pendingMisses.length > 10) this.pendingMisses.shift();
                } catch (e) {
                    console.warn('Mishearing log: could not note a miss:', e);
                }
            }

            // A command just ran, by voice or by tap. Misses shortly before it may
            // have been tries at the same command, so they go into one note. This
            // never throws and never holds up the command: the note is filed in
            // the background.
            noteMishearingFollowUp(cmd, via, heard) {
                try {
                    const misses = this.pendingMisses;
                    this.pendingMisses = [];
                    if (!misses.length) return;
                    const now = Date.now();
                    // Walk back from the command. Each miss must come within the gap
                    // of whatever came after it, so a run of retries stays together
                    // and older, unrelated speech drops off.
                    const chain = [];
                    let next = now;
                    for (let i = misses.length - 1; i >= 0 && next - misses[i].at <= MISHEARING_CHAIN_GAP_MS; i--) {
                        chain.unshift(misses[i]);
                        next = misses[i].at;
                    }
                    const maxWords = MISHEARING_PLAY_COMMAND_IDS.has(cmd.id)
                        ? MISHEARING_MAX_WORDS_BEFORE_PLAY : MISHEARING_MAX_WORDS;
                    const kept = chain.filter(m => {
                        const words = normalizeHeardPhrase(m.heard);
                        return words && words.split(' ').length <= maxWords;
                    }).slice(-MISHEARING_MAX_MISSES);
                    if (!kept.length) return;
                    this.fileMishearingNote({
                        v: 1,
                        misses: kept.map(m => ({ ...m, at: new Date(m.at).toISOString() })),
                        command: { id: cmd.id, label: cmd.label, via, heard, at: new Date(now).toISOString() }
                    });
                } catch (e) {
                    console.warn('Mishearing log: could not pair misses with a command:', e);
                }
            }

            fileMishearingNote(entry) {
                this.mishearingQueue = [...this.mishearingQueue, entry].slice(-MISHEARING_QUEUE_MAX);
                this.saveMishearingQueue();
                this.flushMishearingQueue();
            }

            // File the queued notes in Gmail, oldest first, and only while the
            // sign-in pass is fresh: a Gmail call near the end of the hour can put
            // up the "tap to renew" screen, and a background note must never
            // interrupt Alene for that. A note not filed now goes with the next
            // one, or at the next sign-in.
            async flushMishearingQueue() {
                if (this.mishearingFlushing) return;
                this.mishearingFlushing = true;
                try {
                    while (this.mishearingQueue.length && this.gmail.hasFreshToken()) {
                        const entry = this.mishearingQueue[0];
                        if (!await this.gmail.insertMishearingNote(entry)) break;
                        this.mishearingQueue = this.mishearingQueue.filter(e => e !== entry);
                        this.saveMishearingQueue();
                    }
                } catch (e) {
                    console.warn('Mishearing log: could not file a note; will try again later:', e);
                } finally {
                    this.mishearingFlushing = false;
                }
            }

            // The queue survives a closed page in this phone's storage. Where
            // storage is unavailable (private browsing), it lasts for the visit.
            loadMishearingQueue() {
                try {
                    const saved = JSON.parse(localStorage.getItem(MISHEARING_QUEUE_KEY) || '[]');
                    return Array.isArray(saved) ? saved : [];
                } catch (e) {
                    return [];
                }
            }

            saveMishearingQueue() {
                try {
                    if (this.mishearingQueue.length) {
                        localStorage.setItem(MISHEARING_QUEUE_KEY, JSON.stringify(this.mishearingQueue));
                    } else {
                        localStorage.removeItem(MISHEARING_QUEUE_KEY);
                    }
                } catch (e) {}
            }

            // Match spoken words against a list of recipients
            // Returns the best matching recipient or null
            findMatchingRecipient(spokenName, recipients) {
                if (!recipients || !recipients.length) return null;

                const spokenWords = spokenName.toLowerCase().split(/\s+/).filter(w => w.length > 1);
                if (!spokenWords.length) return null;

                let bestMatch = null;
                let bestScore = 0;

                for (const recipient of recipients) {
                    // Parse "Name <email>" format
                    const angleMatch = recipient.match(/<([^>]+)>/);
                    const email = angleMatch ? angleMatch[1] : recipient;
                    const displayName = angleMatch ? recipient.replace(/<[^>]+>/, '').trim() : '';

                    // Get searchable text (name + email username)
