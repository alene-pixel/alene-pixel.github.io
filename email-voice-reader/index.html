
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Email Reader</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FFECD2 0%, #FCB69F 25%, #FF8A9B 50%, #C9A7EB 75%, #A8D8EA 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 30px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            flex-shrink: 0;
        }

        /* Mobile: reduce body padding to give container more width */
        @media (max-width: 768px) {
            body {
                padding: 15px 6px;
            }
            .container {
                padding: 25px;
            }
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin: 0;
        }

        .logo-image {
            width: 100%;
            max-width: 800px;
            height: auto;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status {
            background: #E8FFF8;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status-text {
            color: #00A8A8;
            font-size: 16px;
        }

        .status-detail {
            color: #1A7A7A;
            font-size: 14px;
            margin-top: 5px;
        }

        .email-display {
            background: #FFF8F5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .email-header {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #FFD6E0;
        }

        .email-from, .email-to, .email-cc {
            font-weight: 600;
            color: #FF8A9B;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .email-subject {
            font-size: 18px;
            font-weight: 600;
            color: #FF6B9D;
            margin-bottom: 5px;
        }

        .email-date {
            color: #FF8A9B;
            font-size: 14px;
        }

        .email-body {
            color: #FF8A9B;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-break: break-word;
            max-height: 300px;
            overflow-x: hidden;
            overflow-y: scroll; /* Changed from auto to always show scrollbar */
            padding-right: 10px;
            scroll-behavior: smooth;
            /* Force scrollbar to always be visible on mobile */
            scrollbar-width: thin;
            scrollbar-color: #FF6B9D #FFD6E0;
        }

        /* Custom scrollbar for webkit browsers (Chrome, Safari, Edge) */
        .email-body::-webkit-scrollbar {
            width: 8px;
            -webkit-appearance: none; /* Force custom scrollbar on iOS */
        }

        .email-body::-webkit-scrollbar-track {
            background: #FFD6E0;
            border-radius: 4px;
        }

        .email-body::-webkit-scrollbar-thumb {
            background: #FF6B9D;
            border-radius: 4px;
            /* Make thumb more visible */
            min-height: 30px;
        }

        .email-body::-webkit-scrollbar-thumb:hover {
            background: #E84C7A;
        }

        /* iOS-specific: ensure scrollbar doesn't auto-hide */
        @supports (-webkit-touch-callout: none) {
            .email-body {
                /* Force persistent scrollbar on iOS */
                -webkit-overflow-scrolling: auto;
            }
        }

        .commands {
            background: #F5F0FF;
            border-radius: 12px;
            padding-top: 5px;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .commands h3 {
            color: #5A3E8A;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .commands.hidden {
            display: none;
        }

        .command-button {
            background: white;
            border: 2px solid #C9A7EB;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .command-button:hover {
            border-color: #5A3E8A;
            background: #C9A7EB;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.2);
        }

        .command-button:active {
            transform: translateY(0);
        }

        /* Disable sticky hover on touch devices - :active still provides pressed feedback */
        @media (hover: none) {
            .command-button:hover {
                border-color: #C9A7EB;
                background: white;
                transform: none;
                box-shadow: none;
            }
        }

        /* Temporarily disable hover styles on newly-created buttons (for mobile touch) */
        .command-button.no-hover:hover {
            border-color: #C9A7EB;
            background: white;
            transform: none;
            box-shadow: none;
        }

        .command-icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        .command-text {
            flex: 1;
            min-width: 0;
            line-height: 1.3;
        }

        .command-text strong {
            color: #5A3E8A;
            font-size: 11px;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .command-text small {
            color: #8B6AAE;
            font-size: 10px;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        .setup-instructions {
            background: #E8FFF8;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .setup-instructions h3 {
            color: #00A8A8;
            margin-bottom: 10px;
        }

        .setup-instructions ol {
            margin-left: 20px;
            color: #1A7A7A;
            line-height: 1.8;
        }

        .setup-instructions a {
            color: #FF6B9D;
            text-decoration: none;
            font-weight: 600;
        }

        .setup-instructions a:hover {
            text-decoration: underline;
        }

        .dictation-display {
            background: #F5F0FF;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .dictation-display h3 {
            margin-bottom: 10px;
            color: #5A3E8A;
        }

        .dictation-text {
            color: #5A3E8A;
            font-size: 16px;
            line-height: 1.6;
            min-height: 50px;
            outline: none;
            border: none;
        }

        .dictation-text.disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .dictation-interim {
            color: #9B7DC4;
            font-style: italic;
            font-size: 15px;
            min-height: 20px;
            padding: 4px 0;
        }

        #buttonContainer {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        /* Single column for recipient buttons on mobile */
        @media (max-width: 500px) {
            .recipient-button {
                grid-column: 1 / -1;
            }
        }

        .forward-input-container {
            grid-column: 1 / -1;
        }

        .forward-input-container label {
            display: block;
            margin-bottom: 8px;
            color: #5A3E8A;
            font-weight: 600;
        }

        .forward-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .forward-input-wrapper input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 2px solid #C9A7EB;
            border-radius: 8px;
            font-size: 11px;
        }

        .forward-input-wrapper input:focus {
            border-color: #FF6B9D;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.25);
        }

        .forward-input-wrapper .command-button {
            width: auto;
            flex-shrink: 0;
        }

        .attachments-display {
            border-radius: 12px;
            padding: 5px 0px;
            margin-top: 15px;
        }

        .attachments-display h4 {
            color: #FF6B9D;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .attachment-item {
            padding: 5px 0;
            font-size: 13px;
        }

        .attachment-item:last-child {
            margin-bottom: 0;
        }

        .attachment-name {
            color: #FF8A9B;
            font-weight: 500;
        }

        /* Welcome Screen Styles */
        #welcomeScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFECD2 0%, #FCB69F 25%, #FF8A9B 50%, #C9A7EB 75%, #A8D8EA 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #welcomeScreen.hidden {
            display: none;
        }

        .welcome-content {
            text-align: center;
            padding: 40px;
        }

        .welcome-text {
            margin-top: 40px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.8s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-cta {
            font-size: 28px;
            color: white;
            font-weight: 600;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        .tap-icon {
            font-size: 40px;
            margin-top: 20px;
            animation: pulse 1.5s ease-in-out infinite;
            animation-delay: 1.5s;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        /* Welcome screen subtitle */
        .welcome-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            margin-top: 8px;
        }

        /* Mic selection buttons on welcome screen */
        .mic-buttons-container {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .mic-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.75);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            padding: 13px 32px;
            cursor: pointer;
            min-width: 260px;
            max-width: 360px;
            transition: background 0.18s, transform 0.1s;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.18);
            font-family: inherit;
        }

        .mic-btn:hover {
            background: rgba(255, 255, 255, 0.42);
            transform: scale(1.03);
        }

        .mic-btn:active {
            transform: scale(0.97);
        }

        .mic-loading {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            font-style: italic;
            margin-top: 8px;
        }

        /* AirPods reminder modal (shown only on desktop after clicking an AirPods option) */
        .airpods-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        .airpods-modal {
            background: white;
            border-radius: 16px;
            max-width: 460px;
            width: 100%;
            padding: 28px 28px 22px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            color: #333;
            font-family: inherit;
        }
        .airpods-modal-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #333;
        }
        .airpods-modal-body {
            font-size: 16px;
            line-height: 1.5;
            color: #444;
            margin-bottom: 22px;
        }
        .airpods-modal-btn {
            background: #FF6B9D;
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 28px;
            cursor: pointer;
            font-family: inherit;
            display: block;
            margin: 0 auto;
            transition: background 0.18s, transform 0.1s;
        }
        .airpods-modal-btn:hover {
            background: #E84C7A;
            transform: scale(1.03);
        }
        .airpods-modal-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <!-- Welcome Screen - appears after Gmail auth; mic button click also unlocks iOS audio -->
    <div id="welcomeScreen">
        <div class="welcome-content">
            <div class="welcome-text">
                <div class="welcome-cta">Welcome!</div>
                <div class="welcome-subtitle">Select your microphone to begin.</div>
            </div>
            <div id="micButtonsContainer" class="mic-buttons-container">
                <div class="mic-loading">Detecting microphones…</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header-row">
            <img src="logo.png" alt="Voice Email Reader" class="logo-image">
        </div>

        <div id="mainSection" class="hidden">
            <div class="status">
                <div class="status-text" id="statusText">Ready to start</div>
                <div class="status-detail" id="statusDetail">Click or say "Start Reading Emails" to begin</div>
            </div>

            <div id="dictationDisplay" class="dictation-display hidden">
                <h3>✍️ Your Message:</h3>
                <div id="dictationText" class="dictation-text" contenteditable="true"></div>
                <div id="dictationInterim" class="dictation-interim"></div>
            </div>

            <div id="emailDisplay" class="email-display hidden">
                <div class="email-header">
                    <div class="email-from" id="emailFrom"></div>
                    <div class="email-to" id="emailTo"></div>
                    <div class="email-cc" id="emailCc"></div>
                    <div class="email-subject" id="emailSubject"></div>
                    <div class="email-date" id="emailDate"></div>
                </div>
                <div class="email-body" id="emailBody"></div>
                <div id="attachmentsDisplay" class="attachments-display hidden">
                    <h4>Attachments:</h4>
                    <div id="attachmentsList"></div>
                </div>
            </div>

            <div class="commands" id="commandsSection">
                <h3>Voice Commands:</h3>
                <div id="buttonContainer"></div>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
    <script>
        // Configure pdf.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <script>
        // ============================================================
        // EMAIL VOICE READER - MVC ARCHITECTURE (Version 4.0)
        // ============================================================
        console.log('=== EMAIL VOICE READER VERSION 4.0 (MVC) LOADED ===');

        // ============================================================
        // LIC-SPECIFIC DICTIONARY (Alene's customizations)
        // ------------------------------------------------------------
        // This block customizes spelling and pronunciation for words
        // specific to Legal Impact for Chickens (LIC). To make the app
        // generic for other users, delete this entire block (and the
        // two applyLICDictionary calls in onresult and speakChunk, plus
        // the applyLegalPronunciations call at the top of
        // formatTextForSpeech) — no other code changes needed.
        //
        // DICTATION_REPLACEMENTS: when speech recognition hears the
        // KEY, write the VALUE instead. Matched case-insensitively at
        // word boundaries.
        //   Example: hearing "ashley" or "Ashley" → writes "Ashely"
        //
        //   This ONE list serves two places, so a name added here is
        //   automatically handled in both — there is no second list to
        //   keep in sync:
        //     1. Dictating a message (handleDictationFinal / Interim).
        //     2. Saying who to forward an email TO
        //        (searchAndSelectRecipient). Added 2026-07-27, after
        //        "forward to Kathryn" answered "I could not find anyone
        //        matching Catherine."
        //   When adding a staff member, include every spelling the
        //   speech API is likely to emit (e.g. catherine / katherine /
        //   catheryn all → Kathryn), because the app matches the words
        //   it was GIVEN, not the words Alene said.
        //
        // PRONUNCIATION_REPLACEMENTS: when the TTS reader encounters
        // the KEY in email text, speak the VALUE instead so it sounds
        // right. Matched case-insensitively at word boundaries.
        //   Example: "LIC" → "lick" so the reader says "lick" not
        //   "L-I-C"
        //
        // LEGAL_PRONUNCIATIONS: legal-citation abbreviations that must be
        // rewritten BEFORE the email/website-domain regexes in
        // formatTextForSpeech run — otherwise those regexes mangle any
        // citation with internal periods (e.g. "S.Ct." → "S dot Ct.").
        // So these are applied via applyLegalPronunciations() at the top
        // of formatTextForSpeech, not in speakChunk like the dictionary
        // above.  Example: "S.Ct." → "Supreme Court".
        // ============================================================
        const LIC_DICTATION_REPLACEMENTS = {
            'ashley': 'Ashely',
            'kathryn': 'Kathryn',
            'catherine': 'Kathryn',
            'katherine': 'Kathryn',
            'catheryn': 'Kathryn',
            'greenfire': 'Greenfire',
            'green fire': 'Greenfire',
            // LIC's own name. Requested by Alene 2026-09-11 from a screenshot of a
            // dictated message that came out "Our legal impact for chicken Facebook
            // messenger ... on the lick behalf."
            //   The two org-name keys are independent because of the \b at the end of
            // each pattern: "...for chicken\b" cannot match inside "chickens" (n and s
            // are both word characters), and "...for chickens\b" cannot match the
            // singular. So neither entry eats the other, whatever order they sit in.
            //   Limit worth knowing: the phrase is matched inside ONE recognition
            // result. If Alene pauses in the middle of saying it, the speech API splits
            // it across two results and neither half matches on its own.
            'legal impact for chickens': 'Legal Impact for Chickens',
            'legal impact for chicken': 'Legal Impact for Chickens',
            // "lick" is how the speech API renders the spoken org name "LIC". Word
            // boundaries keep this narrow: "licking", "licked", "clicked", and "flick"
            // are untouched, because none of them has a boundary on both sides of
            // "lick". "Lick's" DOES match (an apostrophe is not a word character), so
            // it becomes "LIC's" on its own; the separate 'licks' key catches the
            // possessive when the API runs it together without the apostrophe.
            //   Accepted trade-off: the ordinary English word "lick" or "licks" — an
            // animal licking, say — will now be written "LIC". Alene asked for the
            // substitution knowing the org name is far more common in her dictation.
            'lick': 'LIC',
            'licks': "LIC's",
            // Sage Max. Requested by Alene 2026-09-12, after "forward to Sage" was heard
            // as "siege" and the app answered that it could not find anyone matching it.
            //   'sage' -> 'Sage' capitalizes the name when dictating a message (the
            // speech API often writes it lowercase, since "sage" is also an herb). In the
            // forward lookup the case makes no difference — findMatchingRecipient
            // lowercases everything — so that entry is for dictation only.
            //   'saige' is an alternate spelling of the name the API may pick.
            //   The two possessive keys mirror 'licks' above: they catch "Sage's" when
            // the API runs it together without the apostrophe. WITH the apostrophe,
            // "sage's" and "siege's" already come out right, because an apostrophe is
            // not a word character, so the bare 'sage' and 'siege' keys match inside them.
            //   Word boundaries keep all of this narrow: "message", "usage", "passage",
            // "sausage", "besiege", and "besieged" are untouched.
            //   Accepted trade-off: the ordinary English word "siege" — a city under
            // siege — will now be written "Sage". Alene asked for the substitution
            // knowing the name Sage is far more common in Alene's dictation than the word.
            'sage': 'Sage',
            'siege': 'Sage',
            'saige': 'Sage',
            'sieges': "Sage's",
            'sages': "Sage's"
        };
        const LIC_PRONUNCIATION_REPLACEMENTS = {
            'LIC': 'lick',  // say "lick" (the org's name), not the spelled-out letters "L-I-C". Matched case-insensitively at word boundaries, so "LIC", "lic", and the possessive "LIC's" -> "lick"/"licks"; embedded letters like "public"/"license"/"explicit" are untouched (no word boundary).
            'Blome': 'Bloom',  // say "Bloom", not "Blome"
            'USA': 'U. S. A.',  // spell out the letters, don't say "oosa"
            'legalimpactforchickens': 'Legal Impact for Chickens',  // say the four words, not the run-together domain. formatTextForSpeech() already turns "alene@legalimpactforchickens.org" into "alene at legalimpactforchickens dot org" before this runs, so this catches the standalone token.
            'Nilsson': 'Nil, sin',  // iOS TTS. Alene chose this comma form on 2026-06-16 after testing candidates by emailing them to herself in the real app; it was the closest to how Isabella's surname should sound. Prior forms: 'nill sun' (late stress, "nill-SUN") and the period form 'nill. sun' (regressed to "neel-SUN" mid-sentence). Lesson: tune candidates IN CONTEXT (embedded in a sentence), not in isolation, because the default voice shifts vowel+stress around internal phrase breaks. One-word spellings (Nilson/Nillson) -> "NEEL".
            'altacpa': 'Alta C. P. A.'  // Alta CPA Group is LIC's audit firm (contacts Carrie Schenker, Jamie Griffith), whose addresses end in @altacpa.com. Say "Alta C P A", not the run-together word "altacpa". formatTextForSpeech() already turns "carrie@altacpa.com" into "carrie at altacpa dot com" before this runs, so this catches the standalone "altacpa" token (works for "altacpa.com" written as a website too). Letter-spelling uses the period+space form, same as USA above. Not yet tested in-app by Alene as of 2026-07-09.
        };

        function applyLICDictionary(text, dictionary) {
            if (!text) return text;
            let result = text;
            for (const [key, value] of Object.entries(dictionary)) {
                const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const pattern = new RegExp(`\\b${escaped}\\b`, 'gi');
                result = result.replace(pattern, value);
            }
            return result;
        }

        // Legal-citation abbreviations, keyed by how they appear in text.
        // Applied by applyLegalPronunciations() at the TOP of
        // formatTextForSpeech (before the email/domain regexes). Both the
        // unspaced form Alene types (e.g. "S.Ct.") and the spaced Bluebook
        // form courts and Westlaw use (e.g. "S. Ct.") are included.
        const LIC_LEGAL_PRONUNCIATIONS = {
            'S.Ct.': 'Supreme Court',                // Supreme Court Reporter, e.g. "112 S.Ct. 2130"
            'S. Ct.': 'Supreme Court',               // spaced Bluebook form of the same
            'L.Ed.2d': "lawyers' edition second",    // Lawyers' Edition, Second Series, e.g. "119 L.Ed.2d 351"
            'L. Ed. 2d': "lawyers' edition second",  // spaced Bluebook form of the same
            'Lujan': 'Loohahn'                       // surname (as in Lujan v. Defenders of Wildlife); say "Loo-hahn"
        };

        function applyLegalPronunciations(text) {
            if (!text) return text;
            let result = text;
            for (const [key, value] of Object.entries(LIC_LEGAL_PRONUNCIATIONS)) {
                const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                // Anchor a word boundary (\b) only on an edge that is itself a
                // word character. A key ending in "." (like "S.Ct.") can't take a
                // trailing \b — \b never matches between "." and a following
                // space or end-of-string, so a trailing \b would block the whole
                // match. All existing keys start/end on word chars, so this is a
                // no-op for them and only relaxes the trailing-period keys.
                const left  = /\w/.test(key[0])              ? '\\b' : '';
                const right = /\w/.test(key[key.length - 1]) ? '\\b' : '';
                result = result.replace(new RegExp(`${left}${escaped}${right}`, 'gi'), value);
            }
            // "n." → "note", scoped to the legal footnote pattern ONLY: a
            // LOWERCASE "n." immediately followed by a footnote number, so
            // "n.5" and "n. 5" → "note 5". Deliberately case-sensitive and
            // number-gated: a blanket "n." → "note" would also rewrite capital
            // "N." (North, middle initials) — e.g. "John N. Smith" or
            // "123 N. Main St." — because the reader speaks names and addresses.
            result = result.replace(/\bn\.\s?(\d)/g, 'note $1');
            return result;
        }

        // ============================================================
        // EMAIL UTILITIES - Static helper functions
        // ============================================================
        class EmailUtils {
            // Replace user's email address with "you" in address strings
            static replaceUserEmail(addressString, userEmail) {
                if (!userEmail || !addressString) return addressString;

                // Create case-insensitive regex to match the user's email
                const emailRegex = new RegExp(userEmail.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');

                // Handle formats like "Name <email>" or just "email"
                // Replace "Name <user@email.com>" with "you"
                // Replace "user@email.com" with "you"
                const result = addressString.split(',').map(addr => {
                    addr = addr.trim();
                    if (emailRegex.test(addr)) {
                        return 'you';
                    }
                    return addr;
                }).join(', ');

                return result;
            }

            static decodeBase64UTF8(base64) {
                try {
                    const binary = atob(base64.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    return new TextDecoder('utf-8').decode(bytes);
                } catch (e) {
                    return atob(base64.replace(/-/g, '+').replace(/_/g, '/'));
                }
            }

            static getRawEmailBody(email) {
                // Returns the original email body (HTML preferred) without stripping formatting.
                // Used for forwarding so the original formatting is preserved.
                if (!email.payload) return { body: '', isHtml: false };

                try {
                    let plainPart = null, htmlPart = null;

                    if (email.payload.mimeType === 'text/html' && email.payload.body?.data) {
                        return { body: this.decodeBase64UTF8(email.payload.body.data), isHtml: true };
                    }
                    if (email.payload.mimeType === 'text/plain' && email.payload.body?.data) {
                        return { body: this.decodeBase64UTF8(email.payload.body.data), isHtml: false };
                    }

                    if (email.payload.parts) {
                        const findParts = (parts) => {
                            for (let part of parts) {
                                if (part.mimeType === 'text/plain' && part.body?.data && !plainPart) plainPart = part;
                                if (part.mimeType === 'text/html' && part.body?.data && !htmlPart) htmlPart = part;
                                if (part.parts) findParts(part.parts);
                            }
                        };
                        findParts(email.payload.parts);

                        if (htmlPart) return { body: this.decodeBase64UTF8(htmlPart.body.data), isHtml: true };
                        if (plainPart) return { body: this.decodeBase64UTF8(plainPart.body.data), isHtml: false };
                    }
                } catch (e) {
                    console.error('Error extracting raw body:', e);
                }

                return { body: email.snippet || '', isHtml: false };
            }

            static getEmailBody(email) {
                let body = '';

                if (email.payload) {
                    try {
                        if (email.payload.body && email.payload.body.data) {
                            body = this.decodeBase64UTF8(email.payload.body.data);
                        } else if (email.payload.parts) {
                            let plainPart = null, htmlPart = null;

                            const findParts = (parts) => {
                                for (let part of parts) {
                                    if (part.mimeType === 'text/plain' && part.body?.data && !plainPart) plainPart = part;
                                    if (part.mimeType === 'text/html' && part.body?.data && !htmlPart) htmlPart = part;
                                    if (part.parts) findParts(part.parts);
                                }
                            };

                            findParts(email.payload.parts);
                            if (plainPart && htmlPart) {
                                // Prefer the plain-text version, unless the HTML version says far
                                // more. Some senders put only a stand-in in the plain version —
                                // Animal Partisan and Animal Welfare Economics (MailerLite): "your
                                // email software can't display HTML emails"; Faunalytics: "This
                                // email requires a modern e-mail reader"; Substack: just a "view
                                // this post on the web" link — and some mail systems leave only a
                                // legal disclaimer there while the real message sits in the HTML.
                                // Both thresholds must hold, so short notifications whose HTML adds
                                // only a footer (monday.com reminders) keep the plain version.
                                // Tuned on 852 two-version emails from Alene's mail, 2026-10-28.
                                const plainText = this.cleanBodyForSpeech(this.decodeBase64UTF8(plainPart.body.data));
                                const htmlText = this.cleanBodyForSpeech(this.decodeBase64UTF8(htmlPart.body.data));
                                const htmlSaysFarMore = htmlText.length >= 2 * plainText.length &&
                                                        htmlText.length - plainText.length >= 500;
                                return (htmlSaysFarMore ? htmlText : plainText) || 'This email has no text content.';
                            }
                            const partToUse = plainPart || htmlPart;
                            if (partToUse) {
                                body = this.decodeBase64UTF8(partToUse.body.data);
                            }
                        }
                    } catch (e) {
                        console.error('Error extracting body:', e);
                    }
                }

                if (!body && email.snippet) body = email.snippet;
                if (!body) return 'This email has no readable text content.';

                return this.cleanBodyForSpeech(body) || 'This email has no text content.';
            }

            // Turns an email body (plain text or HTML) into the text that gets spoken.
            static cleanBodyForSpeech(body) {
                // Clean HTML/CSS
                // HTML comments first: Outlook-targeted newsletters hide settings in them
                // (<o:PixelsPerInch>96</o:PixelsPerInch>), which otherwise read aloud as "96".
                body = body.replace(/<!--[\s\S]*?-->/g, '');
                body = body.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '');
                body = body.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '');
                // Line and block breaks become spaces, so "document</div><div>Edits" doesn't
                // run together as "documentEdits". Inline tags (<span>, <b>, <a>) still vanish
                // without a space, because they can sit inside a single word.
                body = body.replace(/<(br|\/?(p|div|td|th|tr|li|ul|ol|table|h[1-6]|blockquote))\b[^>]*>/gi, ' ');
                body = body.replace(/<[^>]*>/g, '');
                body = body.replace(/\{[^}]*\}/g, '');
                // Remove leftover "property: value !important;" CSS declarations. The value
                // scan is BOUNDED ({0,200}/{0,40}) on purpose: the old unbounded form
                // /[a-z-]+\s*:\s*[^;]+\s*!important\s*;?/ catastrophically backtracked and
                // hung the whole page (Chrome "Page Unresponsive" / RESULT_CODE_HUNG) on large
                // HTML emails — e.g. a ~99KB Zoom reminder that contained NO "!important" at
                // all, so [^;]+ scanned the entire body from every position looking for a match
                // that never came. Bounding the scan keeps it linear. Fixed 2026-07-12,
                // verified against Alene's real inbox (81KB email: infinite hang -> 28ms).
                body = body.replace(/[a-z-]+\s*:\s*[^;]{0,200}!important[^;]{0,40};?/gi, '');
                // Decode HTML entities (both named like &nbsp; and numeric like &#847; or &#x20;)
                body = body.replace(/&#(\d+);/g, (match, dec) => {
                    const char = String.fromCharCode(dec);
                    // Replace zero-width/invisible characters with nothing
                    if (dec < 32 || (dec >= 127 && dec <= 159) || dec === 847 || dec === 8203 || dec === 8204 || dec === 8205) {
                        return '';
                    }
                    return char;
                });
                body = body.replace(/&#x([0-9a-f]+);/gi, (match, hex) => {
                    const dec = parseInt(hex, 16);
                    if (dec < 32 || (dec >= 127 && dec <= 159) || dec === 847 || dec === 8203 || dec === 8204 || dec === 8205) {
                        return '';
                    }
                    return String.fromCharCode(dec);
                });
                body = body.replace(/&nbsp;/gi, ' ');
                body = body.replace(/&amp;/gi, '&');
                body = body.replace(/&lt;/gi, '<');
                body = body.replace(/&gt;/gi, '>');
                body = body.replace(/&quot;/gi, '"');
                body = body.replace(/&[a-z]+;/gi, ' '); // Any remaining named entities
                body = body.replace(/\s+/g, ' ');
                return body.trim();
            }

            static extractFullBody(part) {
                const extract = (p) => {
                    if (p.body && p.body.data) return this.decodeBase64UTF8(p.body.data);
                    if (p.parts) return p.parts.map(extract).join('');
                    return '';
                };
                return extract(part);
            }

            // Strip URLs from text for speech (so URLs aren't read aloud)
            static stripUrlsForSpeech(text) {
                // Remove URLs but keep surrounding text natural
                // Replace URL with nothing, then clean up extra spaces
                return text
                    .replace(/https?:\/\/[^\s<>"]+/gi, '')
                    .replace(/www\.[^\s<>"]+/gi, '')
                    .replace(/\s{2,}/g, ' ')
                    .trim();
            }

            // Convert URLs in text to clickable links for display
            static renderLinkifiedText(container, text) {
                const safeText = text ?? '';
                const urlRegex = /(https?:\/\/[^\s<>"]+)/gi;
                container.textContent = '';

                let lastIndex = 0;
                let match;

                while ((match = urlRegex.exec(safeText)) !== null) {
                    const url = match[0];
                    if (match.index > lastIndex) {
                        container.appendChild(document.createTextNode(safeText.slice(lastIndex, match.index)));
                    }

                    try {
                        const parsed = new URL(url);
                        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                            throw new Error('Unsupported protocol');
                        }

                        let displayUrl = parsed.hostname + (parsed.pathname.length > 20
                            ? parsed.pathname.substring(0, 20) + '...'
                            : parsed.pathname);
                        if (!displayUrl) {
                            displayUrl = url.length > 40 ? url.substring(0, 40) + '...' : url;
                        }

                        const link = document.createElement('a');
                        link.href = parsed.toString();
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        link.style.color = '#FF6B9D';
                        link.style.textDecoration = 'underline';
                        link.textContent = displayUrl;
                        container.appendChild(link);
                    } catch (e) {
                        container.appendChild(document.createTextNode(url));
                    }

                    lastIndex = match.index + url.length;
                }

                if (lastIndex < safeText.length) {
                    container.appendChild(document.createTextNode(safeText.slice(lastIndex)));
                }
            }

            static getHeader(email, name) {
                const header = email.payload?.headers?.find(h => h.name.toLowerCase() === name.toLowerCase());
                return header ? header.value : '';
            }

            static encodeEmail(emailText) {
                return btoa(unescape(encodeURIComponent(emailText)))
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_')
                    .replace(/=+$/, '');
            }

            // Encode email header value if it contains non-ASCII characters (like emojis)
            static encodeHeaderValue(value) {
                // Check if the value contains any non-ASCII characters
                if (!/[^\x00-\x7F]/.test(value)) {
                    return value; // Plain ASCII, no encoding needed
                }
                // Use RFC 2047 encoded-word syntax: =?charset?B?base64_encoded_text?=
                const encoded = btoa(unescape(encodeURIComponent(value)));
                return `=?UTF-8?B?${encoded}?=`;
            }

            // Get list of attachments from email
            static getAttachments(email) {
                const attachments = [];

                const findAttachments = (parts) => {
                    if (!parts) return;
                    for (const part of parts) {
                        // Check if this part is an attachment
                        if (part.filename && part.filename.length > 0 && part.body) {
                            attachments.push({
                                filename: part.filename,
                                mimeType: part.mimeType || 'application/octet-stream',
                                size: part.body.size || 0,
                                attachmentId: part.body.attachmentId
                            });
                        }
                        // Recursively check nested parts
                        if (part.parts) {
                            findAttachments(part.parts);
                        }
                    }
                };

                if (email.payload) {
                    // Check root level
                    if (email.payload.filename && email.payload.body?.attachmentId) {
                        attachments.push({
                            filename: email.payload.filename,
                            mimeType: email.payload.mimeType || 'application/octet-stream',
                            size: email.payload.body.size || 0,
                            attachmentId: email.payload.body.attachmentId
                        });
                    }
                    // Check parts
                    findAttachments(email.payload.parts);
                }

                return attachments;
            }

            // Check if attachment is readable (text, PDF, or Word)
            static isReadableAttachment(attachment) {
                const filename = attachment.filename.toLowerCase();
                const mimeType = attachment.mimeType.toLowerCase();

                return filename.endsWith('.txt') ||
                       filename.endsWith('.pdf') ||
                       filename.endsWith('.md') ||
                       filename.endsWith('.csv') ||
                       filename.endsWith('.docx') ||
                       mimeType === 'text/plain' ||
                       mimeType === 'text/csv' ||
                       mimeType === 'text/markdown' ||
                       mimeType === 'application/pdf' ||
                       mimeType === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
            }

            // Get human-readable file size
            static formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' bytes';
                if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
                return Math.round(bytes / (1024 * 1024) * 10) / 10 + ' MB';
            }
        }

        // ============================================================
        // SPEECH SERVICE - Text-to-speech and speech recognition
        // Uses sentence chunking for mobile browser compatibility
        // ============================================================
        class SpeechService {
            constructor() {
                this.synthesis = window.speechSynthesis;
                this.recognition = null;
                this.currentUtterance = null;
                this.onCommand = null; // Callback when voice command is heard
                this.onCommandShouldSuppress = null; // Pure pre-check: return true to ignore an accidental repeat WITHOUT cancelling ongoing speech
                this.onInterimDictation = null; // Callback for interim dictation results
                this.onFinalDictation = null; // Callback for final dictation results
                this.dictationMode = false; // When true, use continuous + interim results
                this.allowAutoRestart = false; // Enable auto-restart only after welcome flow is complete
                this.selectedDeviceId = localStorage.getItem('voiceEmailMicDeviceId') || 'default';
                this.activeMicStream = null; // getUserMedia stream held open to nudge Chrome mic routing
                this.isCancelled = false; // Track cancellation for chunked speech
                this.speechGeneration = 0; // Increments each time new speech starts, to invalidate old async loops

                // Resume tracking
                this.remainingSentences = []; // Sentences left to speak when interrupted
                this.canResume = false; // Whether there's something to resume
                this.resumeView = null; // View reference for scroll sync on resume
                this.fullSentences = null; // Complete sentence list (preserved across resume/skip)
                this.absoluteSentenceIndex = 0; // Position within fullSentences (survives resume)

                // Character-based scroll progress tracking
                this.totalCharacters = 0;
                this.charactersSpoken = 0;
                this.scrollStartThreshold = 0; // Don't scroll until this many chars spoken
                this.scrollableCharacters = 0; // Chars after threshold that map to scroll

                // Wake lock to keep screen on while speaking
                this.wakeLock = null;
                this.wakeLockTimer = null;
                this.wakeLockDelay = 15000; // Keep screen on for 15 seconds after speech ends

                this.initRecognition();
            }

            initRecognition() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;
                    this.recognition.lang = 'en-US';

                    this.recognition.onresult = (event) => {
                        if (this.dictationMode) {
                            // Dictation mode: collect interim and final results
                            let finalTranscript = '';
                            let interimTranscript = '';
                            for (let i = event.resultIndex; i < event.results.length; i++) {
                                if (event.results[i].isFinal) {
                                    finalTranscript += event.results[i][0].transcript;
                                } else {
                                    interimTranscript += event.results[i][0].transcript;
                                }
                            }
                            // LIC dictionary: apply spelling overrides to what was heard
                            finalTranscript = applyLICDictionary(finalTranscript, LIC_DICTATION_REPLACEMENTS);
                            interimTranscript = applyLICDictionary(interimTranscript, LIC_DICTATION_REPLACEMENTS);
                            if (finalTranscript.trim()) {
                                console.log('Dictation final:', finalTranscript.trim());
                                this.cancel(); // Stop any ongoing TTS
                                if (this.onFinalDictation) this.onFinalDictation(finalTranscript.trim());
                            }
                            if (this.onInterimDictation) this.onInterimDictation(interimTranscript.trim());
                        } else {
                            // Command mode: single final result
                            const command = event.results[0][0].transcript.trim();
                            console.log('Heard:', command);
                            // Rapid-repeat guard: if this is an accidental repeat of the command
                            // we just ran (user thought the app didn't hear them because of the
                            // iPhone speech delay and said it again), ignore it — and skip cancel()
                            // so the email currently being read keeps playing instead of the app
                            // falling silent. See the double-command entry in KNOWN-ISSUES.md.
                            if (this.onCommandShouldSuppress && this.onCommandShouldSuppress(command)) {
                                console.log('Ignored rapid-repeat command:', command);
                                return;
                            }
                            this.cancel(); // Stop any ongoing speech
                            if (this.onCommand) this.onCommand(command);
                        }
                    };

                    this.recognition.onerror = (event) => {
                        console.error('Speech recognition error:', event.error);
                    };

                    this.recognition.onend = () => {
                        if (!this.allowAutoRestart) return;
                        // Restart listening once voice session is active
                        setTimeout(() => this.startListening(), 100);
                    };
                }

                // Backup: When screen turns back on, try to restart voice listening
                // This helps recover if listening stopped while the screen was off
                document.addEventListener('visibilitychange', () => {
                    if (!this.allowAutoRestart) return;
                    if (!document.hidden && this.recognition) {
                        console.log('Screen turned on - ensuring voice listening is active');
                        // Small delay, then try to start (will safely fail if already running)
                        setTimeout(() => this.startListening(), 500);
                    }
                });
            }

            startListening() {
                if (this.recognition) {
                    try {
                        this.recognition.start();
                        return true;
                    } catch (e) {
                        // Already started
                        return false;
                    }
                }
                return false;
            }

            // Switch to dictation mode: continuous listening with interim results
            enterDictationMode() {
                if (!this.recognition) return;
                this.dictationMode = true;
                try { this.recognition.stop(); } catch (e) {}
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                // Small delay to let stop() complete before restarting
                setTimeout(() => this.startListening(), 150);
            }

            // Switch back to command mode: single utterance, final results only
            exitDictationMode() {
                if (!this.recognition) return;
                this.dictationMode = false;
                try { this.recognition.stop(); } catch (e) {}
                this.recognition.continuous = false;
                this.recognition.interimResults = false;
                // Small delay, then restart in command mode
                setTimeout(() => this.startListening(), 150);
            }

            // Set the active microphone device. Holds a getUserMedia stream on the chosen
            // device, which nudges Chrome's SpeechRecognition to use the same mic.
            async setMicDevice(deviceId) {
                this.selectedDeviceId = deviceId;
                if (deviceId === 'default') {
                    localStorage.removeItem('voiceEmailMicDeviceId');
                } else {
                    localStorage.setItem('voiceEmailMicDeviceId', deviceId);
                }
                // Release old stream
                if (this.activeMicStream) {
                    this.activeMicStream.getTracks().forEach(t => t.stop());
                    this.activeMicStream = null;
                }
                // Claim the selected device to influence Chrome's SpeechRecognition routing
                if (deviceId && deviceId !== 'default') {
                    try {
                        this.activeMicStream = await navigator.mediaDevices.getUserMedia({
                            audio: {
                                deviceId: { exact: deviceId },
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true
                            }
                        });
                        console.log('Mic stream claimed:', deviceId);
                    } catch (e) {
                        console.warn('Could not claim mic device:', e);
                    }
                }
            }

            // Enumerate audio input devices and populate the given <select> element.
            // Only reveals the picker row if more than one microphone is available.
            async populateMicPicker(selectEl, rowEl) {
                try {
                    // Request mic permission first so device labels are populated
                    const permStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    permStream.getTracks().forEach(t => t.stop());
                } catch (e) {
                    return; // Permission denied or not supported
                }
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const mics = devices.filter(d => d.kind === 'audioinput' && d.deviceId !== 'communications');
                    if (mics.length <= 1) return; // Only show picker if there's a real choice

                    selectEl.innerHTML = '';
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = 'default';
                    defaultOpt.textContent = 'System Default';
                    selectEl.appendChild(defaultOpt);

                    mics.forEach(mic => {
                        if (mic.deviceId === 'default') return;
                        const opt = document.createElement('option');
                        opt.value = mic.deviceId;
                        opt.textContent = mic.label || `Microphone ${mic.deviceId.slice(0, 8)}`;
                        selectEl.appendChild(opt);
                    });

                    // Restore saved selection
                    const saved = this.selectedDeviceId;
                    if (saved) {
                        const matchingOpt = Array.from(selectEl.options).find(o => o.value === saved);
                        if (matchingOpt) selectEl.value = saved;
                    }

                    rowEl.classList.remove('hidden');

                    // Claim the saved device if not default
                    if (saved && saved !== 'default') {
                        await this.setMicDevice(saved);
                    }
                } catch (e) {
                    console.warn('Could not enumerate mic devices:', e);
                }
            }

            // Wake lock keeps the screen on while the app is reading
            async acquireWakeLock() {
                // Clear any pending release timer since we're speaking again
                if (this.wakeLockTimer) {
                    clearTimeout(this.wakeLockTimer);
                    this.wakeLockTimer = null;
                }

                // Only acquire if we don't already have one
                if (this.wakeLock) return;

                try {
                    if ('wakeLock' in navigator) {
                        this.wakeLock = await navigator.wakeLock.request('screen');
                        console.log('Wake lock acquired - screen will stay on');

                        // Handle wake lock being released by the system
                        this.wakeLock.addEventListener('release', () => {
                            console.log('Wake lock released by system');
                            this.wakeLock = null;
                        });
                    }
                } catch (e) {
                    // Wake lock not supported or failed - that's ok, not critical
                    console.log('Wake lock not available:', e.message);
                }
            }

            releaseWakeLockAfterDelay() {
                // Clear any existing timer
                if (this.wakeLockTimer) {
                    clearTimeout(this.wakeLockTimer);
                }

                // Release wake lock after delay (gives user time to respond)
                this.wakeLockTimer = setTimeout(async () => {
                    if (this.wakeLock) {
                        try {
                            await this.wakeLock.release();
                            console.log('Wake lock released - screen can turn off now');
                        } catch (e) {
                            // Already released or error - that's ok
                        }
                        this.wakeLock = null;
                    }
                    this.wakeLockTimer = null;
                }, this.wakeLockDelay);
            }

            // Preprocess text for natural TTS pronunciation
            // Must be called BEFORE splitIntoSentences so email dots aren't treated as sentence boundaries
            formatTextForSpeech(text) {
                // Legal-citation pronunciations FIRST — before the domain/email
                // regexes below, which would otherwise mangle citations with
                // internal periods (e.g. "S.Ct." → "S dot Ct.").
                text = applyLegalPronunciations(text);
                // Replace email addresses for natural pronunciation
                // e.g., "user@gmail.com" → "user at gmail dot com"
                text = text.replace(
                    /\b([A-Z0-9._%+-]+)@([A-Z0-9.-]+\.[A-Z]{2,})\b/gi,
                    (match, local, domain) => {
                        const localPart = local.replace(/\./g, ' dot ');
                        const domainPart = domain.replace(/\./g, ' dot ');
                        return `${localPart} at ${domainPart}`;
                    }
                );
                // Replace website domains for natural pronunciation
                // e.g., "Chase.com" → "Chase dot com", "www.example.co.uk" → "www dot example dot co dot uk"
                text = text.replace(
                    /\b([A-Z0-9](?:[A-Z0-9-]*[A-Z0-9])?(?:\.[A-Z0-9](?:[A-Z0-9-]*[A-Z0-9])?)*)\.([A-Z]{2,})\b/gi,
                    (match) => {
                        return match.replace(/\./g, ' dot ');
                    }
                );
                return text;
            }

            // Split text into sentences for mobile compatibility
            // Mobile browsers cut off long utterances, so we chunk by sentence
            splitIntoSentences(text) {
                // Split on sentence-ending punctuation followed by space or end
                // Keep the punctuation with the sentence
                const sentences = text.match(/[^.!?]+[.!?]+[\s]*/g) || [text];
                // Filter out empty strings and trim
                return sentences.map(s => s.trim()).filter(s => s.length > 0);
            }

            // Speak a single chunk (used internally)
            // generation parameter ensures old async loops don't continue after new speech starts
            speakChunk(text, generation) {
                return new Promise((resolve) => {
                    // Check both cancellation flag AND generation to catch stale async loops
                    if (this.isCancelled || generation !== this.speechGeneration) {
                        resolve();
                        return;
                    }

                    // LIC dictionary: apply pronunciation overrides before TTS
                    const speechText = applyLICDictionary(text, LIC_PRONUNCIATION_REPLACEMENTS);
                    this.currentUtterance = new SpeechSynthesisUtterance(speechText);
                    this.currentUtterance.rate = 1.0;
                    this.currentUtterance.pitch = 1.0;
                    this.currentUtterance.volume = 1.0;

                    // WATCHDOG (re-applied 2026-07-13): speechSynthesis intermittently plays
                    // (or silently drops) audio but never fires 'end' or 'error'. Seen on iOS
                    // WebKit (Safari + Chrome on iPhone) AND on desktop Chrome (a captured freeze
                    // on Alene's Mac confirmed it), and it gets likelier after the heavy
                    // cancel/restart churn a voice session produces. speakChunk used to resolve
                    // ONLY on onend/onerror, so a missing 'end' left this Promise pending forever
                    // and the await in speak()/speakWithScroll() hung the whole app — startup
                    // stuck on "Fetching your emails..." (the inbox fetch is chained after the
                    // welcome line) and commands stuck after their spoken confirmation (e.g.
                    // "Archiving email..."). The fallback timer guarantees this Promise always
                    // settles; a settled flag funnels onend/onerror/timer through finish() once.
                    //
                    // History: first added 2026-07-12 (commit 1945575), then reverted (0719cfe)
                    // as "did not fix the freeze" — that was a misdiagnosis: the ReDoS bug in
                    // getEmailBody() was still live then and froze the app BEFORE speech ran,
                    // masking this fix. The ReDoS is fixed (34be2aa), so this is re-applied.
                    // Do NOT remove without a replacement timeout — without it the app freezes
                    // forever on a hung utterance. See FREEZE-INVESTIGATION-2026-07.md.
                    let settled = false;
                    let watchdogTimer = null;
                    const finish = () => {
                        if (settled) return;
                        settled = true;
                        if (watchdogTimer) clearTimeout(watchdogTimer);
                        resolve();
                    };

                    this.currentUtterance.onend = finish;
                    this.currentUtterance.onerror = finish;

                    this.synthesis.speak(this.currentUtterance);

                    // Fallback timer: resolve anyway if 'end' never arrives. The delay is a
                    // generous upper bound on how long this chunk should take to speak
                    // (~100 ms/char is well slower than real speech at rate 1.0), so it does not
                    // cut off legitimate speech — it only fires when the engine has hung.
                    const estimatedSpeakMs = Math.max(5000, speechText.length * 100);
                    watchdogTimer = setTimeout(finish, estimatedSpeakMs);

                    // Chrome/mobile bug workaround - resume if paused
                    setTimeout(() => {
                        if (this.synthesis.paused) this.synthesis.resume();
                    }, 100);
                });
            }

            // Speak text using chunked sentences for mobile compatibility
            async speak(text, onStart = null, onEnd = null) {
                // Increment generation FIRST to invalidate any old async speech loops
                this.speechGeneration++;
                const myGeneration = this.speechGeneration;

                // Keep screen on while speaking
                this.acquireWakeLock();

                if (this.synthesis.paused) this.synthesis.resume();
                this.synthesis.cancel();
                // Keep isCancelled true during delay so old loops can see it and exit

                await new Promise(r => setTimeout(r, 100)); // Brief delay after cancel

                // NOW safe to reset - old loops have had time to check and exit
                this.isCancelled = false;

                text = this.formatTextForSpeech(text);
                const sentences = this.splitIntoSentences(text);

                if (onStart) onStart();

                for (let i = 0; i < sentences.length; i++) {
                    // Check both flag and generation
                    if (this.isCancelled || myGeneration !== this.speechGeneration) break;
                    await this.speakChunk(sentences[i], myGeneration);
                }

                if (onEnd) onEnd();

                // Allow screen to turn off after a delay (gives user time to respond)
                this.releaseWakeLockAfterDelay();
            }

            // Speak with synchronized scrolling (uses chunked speech for mobile)
            // Scrolls based on character progress through the text
            // scrollStartThreshold: don't scroll until this many characters have been spoken
            async speakWithScroll(text, view, scrollStartThreshold = 0) {
                // Increment generation FIRST to invalidate any old async speech loops
                this.speechGeneration++;
                const myGeneration = this.speechGeneration;

                // Keep screen on while speaking
                this.acquireWakeLock();

                if (this.synthesis.paused) this.synthesis.resume();
                this.synthesis.cancel();
                // Keep isCancelled true during delay so old loops can see it and exit

                await new Promise(r => setTimeout(r, 100)); // Brief delay after cancel

                // NOW safe to reset - old loops have had time to check and exit
                this.isCancelled = false;

                text = this.formatTextForSpeech(text);
                const sentences = this.splitIntoSentences(text);

                // Store for potential resume
                this.allSentences = sentences;
                this.fullSentences = sentences; // Preserve full list for skip forward/back
                this.currentSentenceIndex = 0;
                this.resumeView = view;
                this.canResume = true;

                // Calculate total characters for progress-based scrolling
                const totalCharacters = sentences.reduce((sum, s) => sum + s.length, 0);
                let charactersSpoken = 0;

                // Characters that map to scroll (after threshold)
                const scrollableCharacters = Math.max(0, totalCharacters - scrollStartThreshold);

                // Store for resume
                this.totalCharacters = totalCharacters;
                this.scrollStartThreshold = scrollStartThreshold;
                this.scrollableCharacters = scrollableCharacters;
                this.charactersSpoken = 0;

                // Speak all sentences sequentially with synchronized scrolling
                for (let i = 0; i < sentences.length; i++) {
                    // Check cancellation FIRST, before updating any shared state
                    // (prevents race condition where a leap's jumpToSentence sets new
                    // values but this old loop overwrites them before exiting)
                    if (this.isCancelled || myGeneration !== this.speechGeneration) break;

                    // Track current position for resume
                    this.currentSentenceIndex = i;
                    this.absoluteSentenceIndex = i;
                    this.charactersSpoken = charactersSpoken;

                    // Only scroll after passing the threshold (header + buffer)
                    if (charactersSpoken >= scrollStartThreshold && scrollableCharacters > 0) {
                        const scrollProgress = (charactersSpoken - scrollStartThreshold) / scrollableCharacters;
                        view.scrollToProgress(scrollProgress);
                    }

                    await this.speakChunk(sentences[i], myGeneration);
                    charactersSpoken += sentences[i].length;
                }

                // If we finished naturally (not cancelled), clear resume state
                if (!this.isCancelled && myGeneration === this.speechGeneration) {
                    this.canResume = false;
                    this.remainingSentences = [];
                }

                // Allow screen to turn off after a delay (gives user time to respond)
                this.releaseWakeLockAfterDelay();
            }

            cancel() {
                this.isCancelled = true;

                // Save remaining sentences for potential resume
                if (this.allSentences && this.currentSentenceIndex < this.allSentences.length) {
                    this.remainingSentences = this.allSentences.slice(this.currentSentenceIndex);
                    this.canResume = true;
                }

                if (this.synthesis) this.synthesis.cancel();
            }

            // Resume speaking from where we left off, with synchronized scrolling
            async resume() {
                if (!this.canResume || !this.remainingSentences || this.remainingSentences.length === 0) {
                    return false; // Nothing to resume
                }

                // Increment generation to invalidate any old loops
                this.speechGeneration++;
                const myGeneration = this.speechGeneration;

                // Keep screen on while speaking
                this.acquireWakeLock();

                if (this.synthesis.paused) this.synthesis.resume();
                this.synthesis.cancel();

                await new Promise(r => setTimeout(r, 100)); // Brief delay after cancel

                this.isCancelled = false;

                // Restore sentences to speak
                const sentences = this.remainingSentences;
                this.allSentences = sentences;
                this.currentSentenceIndex = 0;

                // Continue character count from where we left off
                let charactersSpoken = this.charactersSpoken || 0;
                const scrollStartThreshold = this.scrollStartThreshold || 0;
                const scrollableCharacters = this.scrollableCharacters || 1;
                const view = this.resumeView;

                // Speak remaining sentences sequentially with synchronized scrolling
                for (let i = 0; i < sentences.length; i++) {
                    // Check cancellation FIRST, before updating any shared state
                    // (prevents race condition where a leap's jumpToSentence sets new
                    // values but this old loop overwrites them before exiting)
                    if (this.isCancelled || myGeneration !== this.speechGeneration) break;

                    this.currentSentenceIndex = i;
                    if (i > 0) this.absoluteSentenceIndex++;
                    this.charactersSpoken = charactersSpoken;

                    // Only scroll after passing the threshold (header + buffer)
                    if (view && charactersSpoken >= scrollStartThreshold && scrollableCharacters > 0) {
                        const scrollProgress = (charactersSpoken - scrollStartThreshold) / scrollableCharacters;
                        view.scrollToProgress(scrollProgress);
                    }

                    await this.speakChunk(sentences[i], myGeneration);
                    charactersSpoken += sentences[i].length;
                }

                // If we finished naturally, clear resume state
                if (!this.isCancelled && myGeneration === this.speechGeneration) {
                    this.canResume = false;
                    this.remainingSentences = [];
                }

                // Allow screen to turn off after a delay (gives user time to respond)
                this.releaseWakeLockAfterDelay();

                return true;
            }

            // Jump to a specific sentence index and resume reading from there
            // Used by skip forward/back to reposition within the current email
            jumpToSentence(targetIndex) {
                // Use fullSentences (the complete list) so skipping works even after resume()
                const sentences = this.fullSentences || this.allSentences;
                if (!sentences || sentences.length === 0) {
                    return false; // No sentences to jump to
                }

                // Clamp target to valid range
                targetIndex = Math.max(0, Math.min(targetIndex, sentences.length - 1));

                // Cancel current speech
                this.isCancelled = true;
                if (this.synthesis) this.synthesis.cancel();

                // Restore full sentence list and set up resume from target position
                this.allSentences = sentences;
                this.remainingSentences = sentences.slice(targetIndex);
                this.currentSentenceIndex = targetIndex;
                this.absoluteSentenceIndex = targetIndex;
                this.canResume = true;

                // Recalculate charactersSpoken for scroll sync
                let chars = 0;
                for (let i = 0; i < targetIndex; i++) {
                    chars += sentences[i].length;
                }
                this.charactersSpoken = chars;

                return true;
            }

            // Skip forward by a number of sentences
            skipForward(count = 3) {
                const sentences = this.fullSentences || this.allSentences;
                const target = (this.absoluteSentenceIndex || 0) + count;
                if (sentences && target >= sentences.length) {
                    return 'past-end'; // Signal that we've gone past the end
                }
                this.jumpToSentence(target);
                return 'ok';
            }

            // Skip backward by a number of sentences
            skipBack(count = 3) {
                const target = (this.absoluteSentenceIndex || 0) - count;
                this.jumpToSentence(Math.max(0, target));
                return 'ok';
            }

            // Clear resume state (call when moving to a different email)
            clearResumeState() {
                this.canResume = false;
                this.remainingSentences = [];
                this.allSentences = null;
                this.fullSentences = null;
                this.currentSentenceIndex = 0;
                this.absoluteSentenceIndex = 0;
                this.charactersSpoken = 0;
                this.totalCharacters = 0;
                this.scrollStartThreshold = 0;
                this.scrollableCharacters = 0;
            }

            get isSpeaking() {
                return this.synthesis.speaking;
            }
        }

        // ============================================================
        // GMAIL SERVICE - All Gmail API calls
        // ============================================================
        class GmailService {
            constructor(model) {
                this.model = model;
                this.SCOPES = 'https://www.googleapis.com/auth/gmail.modify';

                // Google's sign-in pass (the "access token") lasts one hour, and a
                // listening session often runs longer. Until 2026-11-07 nothing renewed
                // it, so an hour in, every Gmail call failed: archives and replies failed
                // while the app announced success, and the next batch fetch read Gmail's
                // "not signed in" answer as "no more emails" — the false "You have reached
                // the end of your unread emails." See renewToken().
                this.tokenClient = null;
                this.tokenExpiresAt = 0; // Date.now() value at which the current pass expires
                this.TOKEN_RENEW_MARGIN_MS = 5 * 60 * 1000; // renew this long before expiry
                this.renewal = null; // the renewal in progress, if any (see renewToken)

                // Set by the controller: show / update / hide the "tap to renew" screen
                this.onRenewalNeedsTap = null;
                this.onRenewalTapFailed = null;
                this.onRenewalDone = null;
            }

            // Every Gmail call goes through here. Besides attaching the sign-in pass,
            // it renews the pass when it is about to expire (or when Gmail refuses it),
            // and fetchWithRetry rides out brief signal drops. Callers must still check
            // response.ok: a failed call must never be read as "no emails" or "done."
            // canRepeat=false is for sending, where repeating a request that may already
            // have gone through could send the email twice.
            async fetchWithAuth(url, options = {}, { canRepeat = true } = {}) {
                if (this.tokenExpiresAt && Date.now() > this.tokenExpiresAt - this.TOKEN_RENEW_MARGIN_MS) {
                    await this.renewToken();
                }
                let response = await this.fetchWithRetry(url, options, canRepeat);
                if (response.status === 401) {
                    // Gmail refused the pass although the clock said it was still good
                    // (for example, the phone slept past the hour). Gmail did nothing
